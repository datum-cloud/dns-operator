name: Internal DNS package

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Qualify internal DNS runtime package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/cache-ci-tools
        with:
          purpose: package
      - uses: docker/setup-buildx-action@v4
      - name: Build serving image with persistent layers
        uses: docker/build-push-action@v7
        with:
          context: .
          file: config/internal-dns/Dockerfile
          target: serving
          load: true
          tags: internal-dns-package:ci
          cache-from: type=gha,scope=qualify-internal-dns-package
          cache-to: type=gha,scope=qualify-internal-dns-package,mode=max
      - name: Build and qualify the runtime package
        env:
          INTERNAL_DNS_PACKAGE_IMAGE: internal-dns-package:ci
        run: task --yes test:internal-dns-package
      - name: Retain package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-dns-package
          path: test/internaldns/results/package
          if-no-files-found: warn
