name: Internal DNS package

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Qualify internal DNS runtime package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and qualify the runtime package
        run: task --yes test:internal-dns-package
      - name: Retain package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-dns-package
          path: test/internaldns/results/package
          if-no-files-found: warn
