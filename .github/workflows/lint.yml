name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          # Official v2.4.0 binaries were built with Go 1.25 and refuse
          # go.mod 1.26. Compile with the toolchain from setup-go instead.
          # The action value is goinstall (not go); unknown modes fall
          # through to a release binary download.
          install-mode: goinstall
