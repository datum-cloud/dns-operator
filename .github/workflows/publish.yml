name: Publish Docker Image

on:
  # Trigger on push
  push:
  # Trigger when a release is published
  release:
    types: ['published']

jobs:
  publish-images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml

  publish-kustomize-bundles:
    # The bundle names the image by tag, so it must not be published until that image exists.
    needs: [publish-images]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.26.0
    with:
      bundle-name: ghcr.io/datum-cloud/dns-operator-kustomize
      bundle-path: config
      image-name: ghcr.io/datum-cloud/dns-operator
      # Every path here gets the built tag stamped into it. A path left out
      # keeps whatever its manifests say, and components/dns-mcp says
      # :latest, which docker/metadata-action only moves on a release. The
      # MCP server would then run the last released build while the rest of
      # the operator ran the one this bundle was cut from, and because the
      # pull policy is Always, two replicas restarting either side of a
      # release would not even match each other.
      image-overlays: config/manager,config/agent,config/components/dns-mcp
    secrets: inherit

  publish-internal-dns-perf:
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.26.0
    with:
      image-name: internal-dns-perf
      context: test/internaldns/perf
      dockerfile-path: test/internaldns/perf/Dockerfile
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-internal-dns-builds:
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    needs: [publish-images, publish-kustomize-bundles]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: fluxcd/flux2/action@v2.10.0
      - name: Publish the runtime and serving image pair
        env:
          RUNTIME_TAG: ${{ needs.publish-images.outputs.tag }}
          SERVING_TAG: ${{ needs.publish-images.outputs.tag }}
        run: hack/publish-internal-dns-channel.sh
