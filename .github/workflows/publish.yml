name: Publish Docker Image

on:
  # Trigger on push
  push:
  # Trigger on all pull requests
  pull_request:
  # Trigger when a release is published
  release:
    types: ['published']

jobs:
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: dns-operator
      platforms: linux/amd64,linux/arm64
    secrets: inherit

  publish-kustomize-bundles:
    # The bundle names the image by tag, so it must not be published until that image exists.
    needs: [publish-container-image]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/datum-cloud/dns-operator-kustomize
      bundle-path: config
      image-name: ghcr.io/datum-cloud/dns-operator
      # Every path here gets the built tag stamped into it. A path left out
      # keeps whatever its manifests say, and components/dns-mcp says
      # :latest, which docker/metadata-action only moves on a release. The
      # MCP server would then run the last released build while the rest of
      # the operator ran the one this bundle was cut from, and because the
      # pull policy is Always, two replicas restarting either side of a
      # release would not even match each other.
      image-overlays: config/manager,config/agent,config/components/dns-mcp
    secrets: inherit
