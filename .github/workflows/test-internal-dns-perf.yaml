name: Test Internal DNS Performance Export

on:
  pull_request:
    paths:
      - '.github/workflows/test-internal-dns-perf.yaml'
      - 'test/internaldns/perf/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-internal-dns-perf.yaml'
      - 'test/internaldns/perf/**'

permissions:
  contents: read

jobs:
  test-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the performance export scripts
        run: task --yes test:internal-dns-perf
