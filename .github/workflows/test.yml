name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: task --yes test

  dnsdist-udp:
    name: DNSdist UDP backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test generated rules with the serving DNSdist image
        run: task --yes test:dnsdist-udp

  alert-rules:
    name: Validate DNS alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install rule test tools
        run: |
          python -m pip install PyYAML==6.0.3
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz -o /tmp/prometheus.tgz
          tar -xzf /tmp/prometheus.tgz -C /tmp prometheus-3.15.0.linux-amd64/promtool
      - uses: zendesk/setup-jsonnet@v16
        with:
          version: v0.20.0
      - name: Test alert rules and dashboard latency queries
        env:
          PROMTOOL: /tmp/prometheus-3.15.0.linux-amd64/promtool
        run: task --yes test:observability
