name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  dnsdist-udp:
    name: DNSdist UDP backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test generated rules with the serving DNSdist image
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/serving.test ./internal/internaldns/serving
          image=$(sed -n 's/^FROM \(powerdns\/dnsdist[^ ]*\) AS serving$/\1/p' config/internal-dns/Dockerfile)
          test -n "$image"
          docker run --rm --network none \
            --mount type=bind,src=/tmp/serving.test,dst=/serving.test,readonly \
            --entrypoint /serving.test \
            -e INTERNAL_DNS_TEST_DNSDIST=/usr/local/bin/dnsdist \
            "$image" -test.run '^TestDNSDistUDPIntegration$' -test.v -test.timeout 30s

  alert-rules:
    name: Validate DNS alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install rule test tools
        run: |
          python -m pip install PyYAML==6.0.3
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz -o /tmp/prometheus.tgz
          tar -xzf /tmp/prometheus.tgz -C /tmp prometheus-3.15.0.linux-amd64/promtool
      - name: Test alert rules
        env:
          PROMTOOL: /tmp/prometheus-3.15.0.linux-amd64/promtool
        run: hack/test-observability-rules.sh
