name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  alert-rules:
    name: Validate DNS alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install rule test tools
        run: |
          python -m pip install PyYAML==6.0.3
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz -o /tmp/prometheus.tgz
          tar -xzf /tmp/prometheus.tgz -C /tmp prometheus-3.15.0.linux-amd64/promtool
      - name: Test alert rules
        env:
          PROMTOOL: /tmp/prometheus-3.15.0.linux-amd64/promtool
        run: hack/test-observability-rules.sh
