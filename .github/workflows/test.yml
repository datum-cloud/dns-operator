name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/cache-ci-tools
        with:
          purpose: tests

      - name: Run tests
        run: task --yes test:ci

  dnsdist-udp:
    name: DNSdist UDP backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test generated rules with the serving DNSdist image
        run: task --yes test:dnsdist-udp

  alert-rules:
    name: Validate DNS alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check observability inputs
        id: changes
        run: bash hack/ci/observability-changes.sh
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: '3.x'
      - if: steps.changes.outputs.run == 'true'
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install rule test tools
        if: steps.changes.outputs.run == 'true'
        run: bash hack/ci/install-rule-tools.sh
      - uses: zendesk/setup-jsonnet@v17
        if: steps.changes.outputs.run == 'true'
        with:
          version: v0.20.0
      - name: Test alert rules and dashboard latency queries
        if: steps.changes.outputs.run == 'true'
        env:
          PROMTOOL: ${{ runner.temp }}/prometheus-3.15.0.linux-amd64/promtool
        run: task --yes test:observability
