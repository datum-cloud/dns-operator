# Local DNS platform environment, built on the shared datum-cloud/test-infra
# tooling (same pattern milo-os/activity uses: a pinned remote Taskfile
# include). Requires:
#   export TASK_X_REMOTE_TASKFILES=1
#
# `task env:up` brings up two kind clusters - "control" (dns-operator +
# PowerDNS + RustFS) and "edge" (PowerDNS only) - and verifies that zone data
# written on the control cluster replicates to the edge cluster via PowerDNS
# Lightningstream over a shared RustFS (S3-compatible) bucket, the same way
# production replicates zone data to edge PoPs over GCS.
version: '3'

vars:
  # Shared bootstrap with dynamic NodePorts and an immutable revision for
  # consistent qualification across environments.
  TEST_INFRA_REPO_REF: '7622c925d5bcf2fa5bc01823775973cf6daf51ca'
  # Upstream (control-plane) cluster runs the replicator; it pushes DNSZone/
  # DNSRecordSet resources to the control cluster, which plays the "downstream"
  # agent role for the replicator and the "control" (Lightningstream source)
  # role for edge replication - one cluster, two roles, mirroring production.
  UPSTREAM_CLUSTER_NAME: 'dns-upstream'
  CONTROL_CLUSTER_NAME: 'dns-control'
  EDGE_CLUSTER_NAME: 'dns-edge'
  IMG: 'ghcr.io/datum-cloud/dns-operator:latest'
  RUSTFS_BUCKET: 'lightningstream'
  RUSTFS_NODEPORT_FILE: 'dev/rustfs.nodeport'
  # In-cluster-rewritten kubeconfig for the control cluster, mounted into the
  # replicator (via a Secret) so it can reach control's API as its downstream.
  CONTROL_INCLUSTER_KUBECONFIG: 'dev/control.incluster.kubeconfig'
  # Admin kubeconfig for the Milo core control plane (milo-apiserver), minted
  # from the static test-admin-token. Used to install DNS CRDs and create the
  # Org + projects on the core CP. Server points at a local port-forward.
  MILO_ADMIN_KUBECONFIG: 'dev/milo.admin.kubeconfig'
  # dns-operator image used by the replicator on dns-upstream. Loaded into the
  # kind node; the overlays reference :latest with imagePullPolicy IfNotPresent.
  DNSOP_IMG: 'ghcr.io/datum-cloud/dns-operator:latest'
  # Cross-cluster kubeconfig the replicator uses to reach milo-apiserver on
  # dns-control, via the envoy gateway NodePort on the control node's IP.
  MILO_UPSTREAM_KUBECONFIG: 'dev/milo.upstream.kubeconfig'
  MILO_GATEWAY_NODEPORT: '32648'
  # Dedicated kubeconfig for this environment (not the user's default
  # ~/.kube/config). go-task's `env:` blocks are implemented as process-wide
  # os.Setenv calls that leak between sibling task/cmd invocations (a known
  # go-task quirk, not scoped per-task as the docs imply) - the included
  # test-infra Taskfile sets KUBECONFIG to its own `.test-infra/kubeconfig`
  # this way, and that value silently leaks into every cmd we run for the
  # rest of the process, clobbering the default kubeconfig assumption. Every
  # kubectl/kind invocation below explicitly sets KUBECONFIG to this
  # fixed path so behavior doesn't depend on call order or that leak.
  ENV_KUBECONFIG: 'dev/kubeconfig'
  ACTIONS_REPO: https://github.com/datum-cloud/actions.git
  DNS_E2E_SHARED_PREREQUISITES: '{{env "DNS_E2E_SHARED_PREREQUISITES" | default "0"}}'

  # Build, test, and tool pins. Override on the command line, for example
  # `task kind-create CLUSTER=dns-downstream`.
  TOOL_DIR: '{{.ROOT_DIR}}/bin'
  CONTAINER_TOOL: docker
  KUBECTL: kubectl
  KIND: kind
  GORELEASER: goreleaser
  PLATFORMS: linux/arm64,linux/amd64,linux/s390x,linux/ppc64le
  KUSTOMIZE_VERSION: v5.7.1
  CONTROLLER_TOOLS_VERSION: v0.19.0
  DEFAULTER_GEN_VERSION: v0.32.3
  ENVTEST_K8S_VERSION: '1.36.0'
  # Lint only code changed since main; `task lint LINT_FLAGS=` runs the full set.
  LINT_FLAGS: --new-from-merge-base=origin/main
  GOLANGCI_LINT: go tool -modfile={{.ROOT_DIR}}/tools/go.mod golangci-lint
  CHAINSAW_VERSION: v0.2.15
  CMCTL_VERSION: v2.1.1
  GATEWAY_API_VERSION: v1.1.0
  # The Prometheus Operator CRDs infra installs (NSO's config/default ships a ServiceMonitor)
  PROMETHEUS_OPERATOR_VERSION: v0.81.0
  # Where datumctl looks for managed plugins. datumctl reads the same location
  # from DATUMCTL_PLUGINS_DIR, so a throwaway install is:
  #   task install-plugin DATUMCTL_PLUGIN_DIR=/tmp/p && DATUMCTL_PLUGINS_DIR=/tmp/p datumctl dns --help
  DATUMCTL_PLUGIN_DIR: '{{env "HOME"}}/.datumctl/plugins'
  KIND_CLUSTER: dns-operator-test-e2e
  # The older two-cluster bootstrap (bootstrap-e2e) and the Network Services
  # Operator integration it can deploy into the upstream cluster.
  DOWNSTREAM_CLUSTER_NAME: dns-downstream
  KIND_IMAGE: '{{.IMG}}'
  NSO_REPO: https://github.com/datum-cloud/network-services-operator.git
  # config/overlays/nso builds NSO from this default path
  NSO_DIR: dev/network-services-operator
  NSO_IMG: ghcr.io/datum-cloud/network-services-operator:latest
  NSO_DEPLOY: 'false'
  # In-network API port for kubeconfigs rewritten by export-kind-kubeconfig;
  # see hack/export-kind-kubeconfig.sh.
  KIND_KUBECONFIG_PORT: '6443'
  DNS_DEBUG_CONTEXT: kind-dns-downstream
  DNS_DEBUG_NAMESPACE: dns-agent-system
  DNS_DEBUG_ZONE: example.com
  DNS_DEBUG_HOST: www
  E2E_DOWNSTREAM_KUBECONFIG: dev/downstream.kubeconfig
  E2E_INSECURE: 'true'
  CHAINSAW_TEST_DIR: '.'
  CHAINSAW_ARGS: ''
  IGNORE_NOT_FOUND: 'false'

includes:
  test-infra:
    taskfile: https://raw.githubusercontent.com/datum-cloud/test-infra/{{.TEST_INFRA_REPO_REF}}/Taskfile.yml
    vars:
      REPO_REF: "{{.TEST_INFRA_REPO_REF}}"
  dashboards:
    taskfile: observability/dashboards/private-dns/Taskfile.yaml
    dir: observability/dashboards/private-dns

tasks:
  ci:
    desc: Run every check CI runs on a single machine (the kind-based suites are `task e2e`)
    cmds:
      - task: generate
      - task: manifests
      - task: generate:verify
      - task: fmt
      - task: vet
      - task: lint
      - task: tidy:verify
      - task: test
      - task: test:dnsdist-udp
      - task: test:observability
      - task: test:dashboards
      - task: test:internal-dns-perf
      - task: test:internal-dns-package
      - task: vuln-scan

  e2e:
    desc: Prepare shared infrastructure and run independent DNS lanes in parallel
    cmds:
      - task: env:foundation-up
      - task: env:shared-prerequisites
      - python3 hack/run-dns-lanes.py --include-harness

  env:shared-prerequisites:
    desc: Install shared tools and CRDs before concurrent DNS deployment
    cmds:
      - task: tools:kustomize
      - task: tools:controller-gen
      - task: tools:chainsaw
      - task: install-dns-operator-crds
        vars: { CONTEXT: 'kind-{{.CONTROL_CLUSTER_NAME}}', KUBECONFIG: '{{.ENV_KUBECONFIG}}' }
      - task: install-dns-operator-crds
        vars: { CONTEXT: 'kind-{{.UPSTREAM_CLUSTER_NAME}}', KUBECONFIG: '{{.ENV_KUBECONFIG}}' }
      - task: install-dns-operator-crds
        vars: { CONTEXT: 'kind-{{.EDGE_CLUSTER_NAME}}', KUBECONFIG: '{{.ENV_KUBECONFIG}}' }
      - task: install-networking-crds
        vars: { CONTEXT: 'kind-{{.UPSTREAM_CLUSTER_NAME}}', KUBECONFIG: '{{.ENV_KUBECONFIG}}' }
      - |
        for cluster in {{.CONTROL_CLUSTER_NAME}} {{.UPSTREAM_CLUSTER_NAME}} {{.EDGE_CLUSTER_NAME}}; do
          KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context "kind-$cluster" wait crd --all --for=condition=Established --timeout=120s || exit 1
        done


  generate:
    desc: Generate DeepCopy methods and config defaults
    run: once
    deps: [tools:controller-gen, tools:defaulter-gen]
    cmds:
      - '{{.TOOL_DIR}}/controller-gen object:headerFile="hack/boilerplate.go.txt" paths="./..."'
      - '{{.TOOL_DIR}}/defaulter-gen ./internal/config --output-file=zz_generated.defaults.go'

  manifests:
    desc: Generate the CRD, RBAC, and webhook manifests
    run: once
    deps: [tools:controller-gen]
    cmds:
      - '{{.TOOL_DIR}}/controller-gen rbac:roleName=manager-role crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases output:webhook:artifacts:config=config/webhook'

  generate:verify:
    desc: Regenerate code and manifests, then fail when the committed files differ
    cmds:
      - task: generate
      - task: manifests
      - hack/verify-generated.sh

  fmt:
    desc: Run go fmt
    run: once
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    run: once
    cmds:
      - go vet ./...

  test:
    desc: Run the Go tests under envtest, after code generation
    cmds:
      - task: generate
      - task: manifests
      - task: fmt
      - task: vet
      - task: setup-envtest
      - KUBEBUILDER_ASSETS="$({{.TOOL_DIR}}/setup-envtest use {{.ENVTEST_K8S_VERSION}} --bin-dir {{.TOOL_DIR}} -p path)" go test $(go list ./... | grep -v /e2e) -coverprofile cover.out
      - INTERNAL_DNS_TEST_PUBLICATION_STORE=memory go test ./internal/internaldns/platform/

  test:dnsdist-udp:
    desc: Test the generated DNSdist rules with the serving DNSdist image
    preconditions:
      - sh: command -v docker
        msg: docker is required
    cmds:
      - hack/test-dnsdist-udp.sh

  test:observability:
    desc: Test the DNS alert rules and dashboard latency queries with promtool
    preconditions:
      - sh: command -v "${PROMTOOL:-promtool}"
        msg: promtool 3 or later is required (or set PROMTOOL)
      - sh: command -v jsonnet
        msg: jsonnet is required
      - sh: python3 -c 'import yaml'
        msg: python3 with PyYAML is required
    cmds:
      - hack/test-dashboard-latency.sh
      - hack/test-observability-rules.sh

  test:dashboards:
    desc: Render the Grafana dashboards and fail when the committed JSON differs
    preconditions:
      - sh: command -v jb
        msg: jsonnet-bundler (jb) is required
      - sh: command -v jsonnet
        msg: jsonnet is required
      - sh: command -v kubectl
        msg: kubectl is required
    cmds:
      - task: dashboards:install
      - task: dashboards:build
      - hack/validate-dashboard-drift
      - hack/validate-dashboards-component.sh

  test:internal-dns-perf:
    desc: Test the internal DNS performance export scripts
    preconditions:
      - sh: command -v python3
        msg: python3 is required
      - sh: command -v node
        msg: node is required
    cmds:
      - bash -n test/internaldns/perf/run.sh test/internaldns/perf/report.sh
      - python3 -m unittest discover -s test/internaldns/perf -p 'test_report.py'
      - node test/internaldns/perf/test-metadata.cjs

  test:internal-dns-package:
    desc: Build and qualify the internal DNS runtime image and deployment contracts
    deps: [tools:setup-envtest, tools:kustomize]
    preconditions:
      - sh: command -v docker
        msg: docker is required
    cmds:
      - test/internaldns/qualify-package.sh

  test:internal-dns-kubernetes:
    desc: Test the private DNS Kubernetes harness
    cmds:
      - go test ./test/internaldns/kubernetes/...

  lint:
    desc: Run golangci-lint on code changed since main (LINT_FLAGS= lints everything)
    cmds:
      - '{{.GOLANGCI_LINT}} run {{.LINT_FLAGS}}'

  lint-fix:
    desc: Run golangci-lint and apply fixes
    cmds:
      - '{{.GOLANGCI_LINT}} run --fix {{.LINT_FLAGS}}'

  lint-config:
    desc: Verify the golangci-lint configuration
    cmds:
      - '{{.GOLANGCI_LINT}} config verify'

  tidy:verify:
    desc: Fail when go mod tidy would change go.mod or go.sum in the root or tools module
    cmds:
      - hack/verify-tidy.sh . tools

  build:
    desc: Build the manager binary into bin/
    cmds:
      - task: generate
      - task: manifests
      - task: fmt
      - task: vet
      - go build -o {{.TOOL_DIR}}/manager cmd/main.go

  run:
    desc: Run the manager from the host
    cmds:
      - task: generate
      - task: manifests
      - task: fmt
      - task: vet
      - go run ./cmd/main.go

  docker-build:
    desc: Build the manager image as IMG
    cmds:
      - '{{.CONTAINER_TOOL}} build -t {{.IMG}} .'

  docker-push:
    desc: Push the manager image IMG
    cmds:
      - '{{.CONTAINER_TOOL}} push {{.IMG}}'

  docker-buildx:
    desc: Build and push the manager image for every platform in PLATFORMS
    cmds:
      - |
        set -euo pipefail
        sed -e '1 s/\(^FROM\)/FROM --platform=${BUILDPLATFORM}/; t' -e ' 1,// s//FROM --platform=${BUILDPLATFORM}/' Dockerfile > Dockerfile.cross
        {{.CONTAINER_TOOL}} buildx create --name dns-operator-builder || true
        {{.CONTAINER_TOOL}} buildx use dns-operator-builder
        {{.CONTAINER_TOOL}} buildx build --push --platform={{.PLATFORMS}} --tag {{.IMG}} -f Dockerfile.cross . || true
        {{.CONTAINER_TOOL}} buildx rm dns-operator-builder || true
        rm Dockerfile.cross

  build-installer:
    desc: Write a consolidated install manifest with CRDs and the deployment to dist/install.yaml
    deps: [tools:kustomize]
    cmds:
      - task: manifests
      - task: generate
      - mkdir -p dist
      - cd config/manager && {{.TOOL_DIR}}/kustomize edit set image controller={{.IMG}}
      - '{{.TOOL_DIR}}/kustomize build config/default > dist/install.yaml'

  build-plugin:
    desc: Build the datumctl-dns plugin binary into bin/
    vars:
      # Release builds go through goreleaser (.goreleaser-plugin.yaml); this
      # stamps local builds.
      PLUGIN_VERSION:
        sh: git describe --tags --dirty --always 2>/dev/null || echo dev
    cmds:
      - mkdir -p {{.TOOL_DIR}}
      - go build -ldflags "-X main.version={{.PLUGIN_VERSION}}" -o {{.TOOL_DIR}}/datumctl-dns ./cmd/datumctl-dns

  install-plugin:
    desc: Install the datumctl-dns plugin into DATUMCTL_PLUGIN_DIR
    deps: [build-plugin]
    cmds:
      - mkdir -p {{.DATUMCTL_PLUGIN_DIR}}
      - install -m 0755 {{.TOOL_DIR}}/datumctl-dns {{.DATUMCTL_PLUGIN_DIR}}/datumctl-dns
      - echo "Installed {{.DATUMCTL_PLUGIN_DIR}}/datumctl-dns; try 'datumctl dns --help'"

  release-plugin-snapshot:
    desc: Build the plugin release archives into dist/ without publishing
    preconditions:
      - sh: command -v {{.GORELEASER}}
        msg: "goreleaser is not installed. Install it (for example 'brew install goreleaser') or set GORELEASER=<path>."
    cmds:
      - '{{.GORELEASER}} release --config .goreleaser-plugin.yaml --snapshot --clean'

  install:
    desc: Install the CRDs into the cluster in the current kubeconfig
    deps: [tools:kustomize]
    cmds:
      - task: manifests
      - |
        out="$({{.TOOL_DIR}}/kustomize build config/crd 2>/dev/null || true)"
        if [ -n "$out" ]; then echo "$out" | {{.KUBECTL}} apply -f -; else echo "No CRDs to install; skipping."; fi

  uninstall:
    desc: Uninstall the CRDs from the cluster in the current kubeconfig (IGNORE_NOT_FOUND=true ignores missing resources)
    deps: [tools:kustomize]
    cmds:
      - task: manifests
      - |
        out="$({{.TOOL_DIR}}/kustomize build config/crd 2>/dev/null || true)"
        if [ -n "$out" ]; then echo "$out" | {{.KUBECTL}} delete --ignore-not-found={{.IGNORE_NOT_FOUND}} -f -; else echo "No CRDs to delete; skipping."; fi

  deploy:
    desc: Deploy the controller as IMG into the cluster in the current kubeconfig
    deps: [tools:kustomize]
    cmds:
      - task: manifests
      - cd config/manager && {{.TOOL_DIR}}/kustomize edit set image controller={{.IMG}}
      - '{{.TOOL_DIR}}/kustomize build config/default | {{.KUBECTL}} apply -f -'

  undeploy:
    desc: Remove the controller from the cluster in the current kubeconfig (IGNORE_NOT_FOUND=true ignores missing resources)
    deps: [tools:kustomize]
    cmds:
      - '{{.TOOL_DIR}}/kustomize build config/default | {{.KUBECTL}} delete --ignore-not-found={{.IGNORE_NOT_FOUND}} -f -'

  cert-manager:
    desc: Install cert-manager into the cluster selected by CONTEXT and/or KUBECONFIG
    deps: [tools:kustomize, tools:cmctl]
    vars:
      FLAGS: '{{if .CONTEXT}}--context {{.CONTEXT}}{{end}} {{if .KUBECONFIG}}--kubeconfig {{.KUBECONFIG}}{{end}}'
    cmds:
      - echo "[cert-manager] applying with {{.FLAGS}}"
      - '{{.TOOL_DIR}}/kustomize build --enable-helm config/tools/cert-manager | {{.KUBECTL}} {{.FLAGS}} apply --server-side=true --force-conflicts -f -'
      - '{{.TOOL_DIR}}/cmctl {{.FLAGS}} check api --wait=5m'

  setup-test-e2e:
    desc: Create the KIND_CLUSTER kind cluster for e2e tests if it does not exist
    cmds:
      - task: kind-create
        vars:
          CLUSTER: '{{.KIND_CLUSTER}}'

  kind-create:
    desc: Create the kind cluster CLUSTER if it does not exist
    requires:
      vars: [CLUSTER]
    cmds:
      - |
        case "$({{.KIND}} get clusters)" in
          *"{{.CLUSTER}}"*) echo "Kind cluster '{{.CLUSTER}}' already exists. Skipping." ;;
          *) echo "Creating Kind cluster '{{.CLUSTER}}'..."; {{.KIND}} create cluster --name {{.CLUSTER}} ;;
        esac

  kind-delete:
    desc: Delete the kind cluster CLUSTER
    requires:
      vars: [CLUSTER]
    cmds:
      - '{{.KIND}} delete cluster --name {{.CLUSTER}}'

  kind-load-image:
    desc: Build the manager image as KIND_IMAGE and load it into the kind cluster CLUSTER
    requires:
      vars: [CLUSTER]
    cmds:
      - task: docker-build
        vars:
          IMG: '{{.KIND_IMAGE}}'
      - '{{.KIND}} load docker-image {{.KIND_IMAGE}} --name {{.CLUSTER}}'

  kind-load-existing-image:
    desc: Load the already built KIND_IMAGE into CLUSTER
    requires:
      vars: [CLUSTER]
    cmds:
      - '{{.KIND}} load docker-image {{.KIND_IMAGE}} --name {{.CLUSTER}}'

  env:public-image-build:
    desc: Build the public DNS image once per task invocation
    run: once
    cmds:
      - task: docker-build
        vars:
          IMG: '{{.KIND_IMAGE}}'

  kustomize-apply:
    desc: Apply the kustomize directory KUSTOMIZE_DIR to the kubectl context CONTEXT
    deps: [tools:kustomize]
    requires:
      vars: [KUSTOMIZE_DIR, CONTEXT]
    cmds:
      - '{{.TOOL_DIR}}/kustomize build --load-restrictor LoadRestrictionsNone {{.KUSTOMIZE_DIR}} | {{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply -f -'

  kustomize-apply-ssa:
    desc: Apply the kustomize directory KUSTOMIZE_DIR to CONTEXT with server-side apply, forcing conflicts
    deps: [tools:kustomize]
    requires:
      vars: [KUSTOMIZE_DIR, CONTEXT]
    cmds:
      - '{{.TOOL_DIR}}/kustomize build --load-restrictor LoadRestrictionsNone {{.KUSTOMIZE_DIR}} | {{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply --server-side=true --force-conflicts -f -'

  export-kind-kubeconfig:
    desc: Export the kubeconfig of kind cluster CLUSTER to OUT, rewritten for in-network access
    requires:
      vars: [CLUSTER, OUT]
    cmds:
      - KIND={{.KIND}} KIND_KUBECONFIG_PORT={{.KIND_KUBECONFIG_PORT}} KIND_KUBECONFIG_HOST={{.KIND_KUBECONFIG_HOST}} KIND_KUBECONFIG_INSECURE={{.KIND_KUBECONFIG_INSECURE}} hack/export-kind-kubeconfig.sh {{.CLUSTER}} {{.OUT}}

  export-kind-kubeconfig-raw:
    desc: Export the kubeconfig of kind cluster CLUSTER to OUT as kind reports it
    requires:
      vars: [CLUSTER, OUT]
    cmds:
      - mkdir -p "$(dirname {{.OUT}})"
      - '{{.KIND}} get kubeconfig --name {{.CLUSTER}} > {{.OUT}}'

  secret-from-file:
    desc: Create or update secret NAME from FILE under key KEY in NAMESPACE on CONTEXT
    requires:
      vars: [NAMESPACE, NAME, KEY, FILE, CONTEXT]
    cmds:
      - '{{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} -n {{.NAMESPACE}} create secret generic {{.NAME}} --from-file={{.KEY}}={{.FILE}} --dry-run=client -o yaml | {{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply -f -'

  bootstrap-downstream:
    desc: Create the kind downstream cluster and deploy the agent with embedded PowerDNS
    cmds:
      - task: kind-create
        vars:
          CLUSTER: '{{.DOWNSTREAM_CLUSTER_NAME}}'
      - task: kind-load-image
        vars:
          CLUSTER: '{{.DOWNSTREAM_CLUSTER_NAME}}'
      - task: install-dns-operator-crds
        vars:
          CONTEXT: kind-{{.DOWNSTREAM_CLUSTER_NAME}}
      - task: kustomize-apply
        vars:
          CONTEXT: kind-{{.DOWNSTREAM_CLUSTER_NAME}}
          KUSTOMIZE_DIR: config/overlays/agent-powerdns
      # Export the external kubeconfig for the downstream cluster (reachable from the host and other containers)
      - task: export-kind-kubeconfig-raw
        vars:
          CLUSTER: '{{.DOWNSTREAM_CLUSTER_NAME}}'
          OUT: dev/kind.downstream.kubeconfig

  bootstrap-upstream:
    desc: Create the kind upstream cluster and deploy the replicator pointing at DOWNSTREAM_KUBECONFIG
    preconditions:
      - sh: test -n "{{.DOWNSTREAM_KUBECONFIG}}"
        msg: "DOWNSTREAM_KUBECONFIG is required. Generate it with: task export-downstream-kubeconfig OUT=dev/downstream.kubeconfig"
    cmds:
      - task: kind-create
        vars:
          CLUSTER: '{{.UPSTREAM_CLUSTER_NAME}}'
      - task: kind-load-image
        vars:
          CLUSTER: '{{.UPSTREAM_CLUSTER_NAME}}'
      - task: cert-manager
        vars:
          CONTEXT: kind-{{.UPSTREAM_CLUSTER_NAME}}
      # The replicator also watches networking-services types (Domain, etc.)
      - task: install-networking-crds
        vars:
          CONTEXT: kind-{{.UPSTREAM_CLUSTER_NAME}}
      # Export the external kubeconfig for the upstream cluster (used to deploy NSO)
      - task: export-kind-kubeconfig-raw
        vars:
          CLUSTER: '{{.UPSTREAM_CLUSTER_NAME}}'
          OUT: dev/kind.upstream.kubeconfig
      - task: bootstrap-upstream-nso
        vars:
          NSO_DEPLOY: '{{.NSO_DEPLOY}}'
      - '{{.KUBECTL}} --context kind-{{.UPSTREAM_CLUSTER_NAME}} create namespace dns-replicator-system --dry-run=client -o yaml | {{.KUBECTL}} --context kind-{{.UPSTREAM_CLUSTER_NAME}} apply -f -'
      - task: secret-from-file
        vars:
          CONTEXT: kind-{{.UPSTREAM_CLUSTER_NAME}}
          NAMESPACE: dns-replicator-system
          NAME: downstream-kubeconfig
          KEY: kubeconfig
          FILE: '{{.DOWNSTREAM_KUBECONFIG}}'
      - task: kustomize-apply
        vars:
          CONTEXT: kind-{{.UPSTREAM_CLUSTER_NAME}}
          KUSTOMIZE_DIR: config/overlays/replicator

  bootstrap-upstream-nso:
    desc: Build and deploy the Network Services Operator into the upstream cluster when NSO_DEPLOY=true
    internal: true
    status:
      - test "{{.NSO_DEPLOY}}" != "true"
    cmds:
      - echo "[bootstrap-upstream] Installing Kubernetes Gateway API CRDs ({{.GATEWAY_API_VERSION}})"
      - task: install-gateway-api-crds
        vars:
          CONTEXT: kind-{{.UPSTREAM_CLUSTER_NAME}}
      - task: install-prometheus-operator-crds
        vars:
          CONTEXT: kind-{{.UPSTREAM_CLUSTER_NAME}}
      - task: nso-deploy-upstream
        vars:
          KUBECONFIG: '{{.ROOT_DIR}}/dev/kind.upstream.kubeconfig'

  export-downstream-kubeconfig:
    desc: Export the downstream kubeconfig to OUT, rewritten for in-cluster use by upstream
    requires:
      vars: [OUT]
    cmds:
      - task: export-kind-kubeconfig
        vars:
          CLUSTER: '{{.DOWNSTREAM_CLUSTER_NAME}}'
          OUT: '{{.OUT}}'
          KIND_KUBECONFIG_INSECURE: '{{.KIND_KUBECONFIG_INSECURE}}'

  bootstrap-e2e:
    desc: Bootstrap downstream, export its kubeconfig, then bootstrap upstream
    cmds:
      - task: bootstrap-downstream
      - task: export-downstream-kubeconfig
        vars:
          OUT: '{{.E2E_DOWNSTREAM_KUBECONFIG}}'
          KIND_KUBECONFIG_INSECURE: '{{.E2E_INSECURE}}'
      - task: bootstrap-upstream
        vars:
          DOWNSTREAM_KUBECONFIG: '{{.E2E_DOWNSTREAM_KUBECONFIG}}'
          NSO_DEPLOY: '{{.NSO_DEPLOY}}'
      - 'echo "E2E bootstrap complete. Upstream: {{.UPSTREAM_CLUSTER_NAME}}, Downstream: {{.DOWNSTREAM_CLUSTER_NAME}}."'
      - 'echo "Downstream kubeconfig: {{.E2E_DOWNSTREAM_KUBECONFIG}}"'
      - 'echo "External kubeconfigs: dev/kind.downstream.kubeconfig, dev/kind.upstream.kubeconfig"'

  bootstrap-e2e-with-nso:
    desc: Bootstrap e2e and also install and configure NSO in upstream
    cmds:
      - task: bootstrap-e2e
        vars:
          NSO_DEPLOY: 'true'

  dns-debug:
    desc: Launch a DNS tools pod on DNS_DEBUG_CONTEXT and query PowerDNS for DNS_DEBUG_ZONE
    cmds:
      - |
        set -euo pipefail
        kubectl="{{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}kubectl --context {{.DNS_DEBUG_CONTEXT}} -n {{.DNS_DEBUG_NAMESPACE}}"
        pdns=pdns-auth.{{.DNS_DEBUG_NAMESPACE}}.svc.cluster.local
        echo "[dns-debug] Ensuring dnstools pod exists in {{.DNS_DEBUG_NAMESPACE}}"
        eval "$kubectl get pod dnstools" >/dev/null 2>&1 || \
          eval "$kubectl run dnstools --image=infoblox/dnstools:latest --restart=Never --command -- sh -c 'sleep 3600'"
        eval "$kubectl wait --for=condition=Ready pod/dnstools --timeout=90s"
        echo "[dns-debug] Querying PDNS Service $pdns"
        eval "$kubectl exec dnstools -- sh -lc 'echo SOA:; dig +time=2 +tries=1 +short @$pdns {{.DNS_DEBUG_ZONE}} SOA; \
          echo NS:; dig +time=2 +tries=1 +short @$pdns {{.DNS_DEBUG_ZONE}} NS; \
          echo A {{.DNS_DEBUG_HOST}}.{{.DNS_DEBUG_ZONE}}:; dig +time=2 +tries=1 +short @$pdns {{.DNS_DEBUG_HOST}}.{{.DNS_DEBUG_ZONE}} A'"

  chainsaw-prepare-kubeconfigs:
    desc: Copy the dev kind kubeconfigs into test/e2e for stable relative resolution
    preconditions:
      - sh: test -f dev/kind.upstream.kubeconfig
        msg: Missing dev/kind.upstream.kubeconfig. Bootstrap clusters first.
      - sh: test -f dev/kind.downstream.kubeconfig
        msg: Missing dev/kind.downstream.kubeconfig. Bootstrap clusters first.
    cmds:
      - cp dev/kind.upstream.kubeconfig test/e2e/kubeconfig-upstream
      - cp dev/kind.downstream.kubeconfig test/e2e/kubeconfig-downstream

  chainsaw-test:
    desc: Run the Chainsaw tests in CHAINSAW_TEST_DIR with CHAINSAW_ARGS against the bootstrapped clusters
    deps: [tools:chainsaw]
    cmds:
      - task: chainsaw-prepare-kubeconfigs
      - cd test/e2e && {{.TOOL_DIR}}/chainsaw test {{.CHAINSAW_ARGS}} {{.CHAINSAW_TEST_DIR}}

  nso-clone:
    desc: Clone network-services-operator into NSO_DIR if missing
    status:
      - test -d {{.NSO_DIR}}
    cmds:
      - echo "Cloning {{.NSO_REPO}} into {{.NSO_DIR}}"
      - git clone {{.NSO_REPO}} {{.NSO_DIR}}

  nso-build:
    desc: Build the NSO image NSO_IMG from NSO_DIR
    deps: [nso-clone]
    cmds:
      - make -C {{.NSO_DIR}} docker-build IMG={{.NSO_IMG}}

  nso-load-upstream:
    desc: Load the NSO image into the upstream kind cluster
    cmds:
      - '{{.KIND}} load docker-image {{.NSO_IMG}} --name {{.UPSTREAM_CLUSTER_NAME}}'

  nso-deploy-upstream:
    desc: Deploy NSO with config/overlays/nso into the upstream cluster using KUBECONFIG
    deps: [tools:kustomize]
    requires:
      vars: [KUBECONFIG]
    cmds:
      - task: nso-build
      - task: nso-load-upstream
      - KUBECONFIG={{.KUBECONFIG}} make -C {{.NSO_DIR}} set-image-controller IMG={{.NSO_IMG}}
      - '{{.TOOL_DIR}}/kustomize build --load-restrictor LoadRestrictionsNone config/overlays/nso | KUBECONFIG={{.KUBECONFIG}} {{.KUBECTL}} apply --server-side=true --force-conflicts -f -'

  install-networking-crds:
    status:
      - 'test "{{.DNS_E2E_SHARED_PREREQUISITES}}" = "1"'
    desc: Generate the networking services CRDs (Domain and others) and install them into CONTEXT
    deps: [tools:controller-gen]
    requires:
      vars: [CONTEXT]
    cmds:
      - mkdir -p dev/crds/network-services
      - '{{.TOOL_DIR}}/controller-gen crd:crdVersions=v1 paths="go.datum.net/network-services-operator/api/v1alpha" output:crd:dir=dev/crds/network-services'
      - '{{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply -f dev/crds/network-services'

  install-dns-operator-crds:
    status:
      - 'test "{{.DNS_E2E_SHARED_PREREQUISITES}}" = "1"'
    desc: Install the DNS operator CRDs into CONTEXT
    deps: [tools:kustomize]
    requires:
      vars: [CONTEXT]
    cmds:
      - '{{.TOOL_DIR}}/kustomize build config/crd | {{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply -f -'

  install-gateway-api-crds:
    desc: Install the Kubernetes Gateway API CRDs into CONTEXT
    requires:
      vars: [CONTEXT]
    cmds:
      - '{{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply -k "github.com/kubernetes-sigs/gateway-api/config/crd?ref={{.GATEWAY_API_VERSION}}"'

  install-prometheus-operator-crds:
    desc: Install the Prometheus Operator CRDs into CONTEXT
    requires:
      vars: [CONTEXT]
    cmds:
      - '{{if .KUBECONFIG}}KUBECONFIG={{.KUBECONFIG}} {{end}}{{.KUBECTL}} --context {{.CONTEXT}} apply --server-side -f "https://github.com/prometheus-operator/prometheus-operator/releases/download/{{.PROMETHEUS_OPERATOR_VERSION}}/stripped-down-crds.yaml"'

  setup-envtest:
    desc: Download the envtest binaries for ENVTEST_K8S_VERSION into bin/
    deps: [tools:setup-envtest]
    cmds:
      - echo "Setting up envtest binaries for Kubernetes version {{.ENVTEST_K8S_VERSION}}..."
      - '{{.TOOL_DIR}}/setup-envtest use {{.ENVTEST_K8S_VERSION}} --bin-dir {{.TOOL_DIR}} -p path'

  tools:go-install:
    desc: Install a Go tool into bin/ as NAME-VERSION, symlinked from NAME
    internal: true
    run: when_changed
    requires:
      vars: [NAME, PACKAGE, VERSION]
    status:
      - test -x {{.TOOL_DIR}}/{{.NAME}}-{{.VERSION}}
      - test "$(readlink {{.TOOL_DIR}}/{{.NAME}})" = "{{.TOOL_DIR}}/{{.NAME}}-{{.VERSION}}"
    cmds:
      - hack/install-go-tool.sh {{.TOOL_DIR}} {{.NAME}} {{.PACKAGE}} {{.VERSION}}

  tools:kustomize:
    status:
      - 'test "{{.DNS_E2E_SHARED_PREREQUISITES}}" = "1" && test -x "{{.TOOL_DIR}}/kustomize"'
    desc: Install kustomize into bin/
    cmds:
      - task: tools:go-install
        vars: { NAME: kustomize, PACKAGE: sigs.k8s.io/kustomize/kustomize/v5, VERSION: '{{.KUSTOMIZE_VERSION}}' }

  tools:controller-gen:
    status:
      - 'test "{{.DNS_E2E_SHARED_PREREQUISITES}}" = "1" && test -x "{{.TOOL_DIR}}/controller-gen"'
    desc: Install controller-gen into bin/
    cmds:
      - task: tools:go-install
        vars: { NAME: controller-gen, PACKAGE: sigs.k8s.io/controller-tools/cmd/controller-gen, VERSION: '{{.CONTROLLER_TOOLS_VERSION}}' }

  tools:defaulter-gen:
    desc: Install defaulter-gen into bin/
    cmds:
      - task: tools:go-install
        vars: { NAME: defaulter-gen, PACKAGE: k8s.io/code-generator/cmd/defaulter-gen, VERSION: '{{.DEFAULTER_GEN_VERSION}}' }

  tools:setup-envtest:
    desc: Install setup-envtest into bin/, from the controller-runtime release branch in go.mod
    vars:
      ENVTEST_VERSION:
        sh: go list -m sigs.k8s.io/controller-runtime | awk '{split($2, v, "."); printf "release-%s.%s", substr(v[1], 2), v[2]}'
    cmds:
      - task: tools:go-install
        vars: { NAME: setup-envtest, PACKAGE: sigs.k8s.io/controller-runtime/tools/setup-envtest, VERSION: '{{.ENVTEST_VERSION}}' }

  tools:chainsaw:
    status:
      - 'test "{{.DNS_E2E_SHARED_PREREQUISITES}}" = "1" && test -x "{{.TOOL_DIR}}/chainsaw"'
    desc: Install chainsaw into bin/
    cmds:
      - task: tools:go-install
        vars: { NAME: chainsaw, PACKAGE: github.com/kyverno/chainsaw, VERSION: '{{.CHAINSAW_VERSION}}' }

  tools:cmctl:
    desc: Install cmctl into bin/
    cmds:
      - task: tools:go-install
        vars: { NAME: cmctl, PACKAGE: github.com/cert-manager/cmctl/v2, VERSION: '{{.CMCTL_VERSION}}' }

  env:internal-dns:up:
    desc: "Prepare the foundation and deploy private DNS"
    cmds:
      - task: env:foundation-up
      - task: env:internal-dns:deploy

  env:foundation-up:
    desc: "Prepare three dual-stack clusters and shared infrastructure without DNS workloads"
    cmds:
      - task: test-infra:ensure-repo
      - task: test-infra:ensure-tools
      - test/internaldns/kubernetes/prepare-kind.sh
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.CONTROL_CLUSTER_NAME}}"
          KIND_CFG: .internal-dns-e2e/kubernetes/kind-config.yaml
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.UPSTREAM_CLUSTER_NAME}}"
          KIND_CFG: .internal-dns-e2e/kubernetes/kind-config.yaml
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.EDGE_CLUSTER_NAME}}"
          KIND_CFG: .internal-dns-e2e/kubernetes/kind-config.yaml

  env:internal-dns:deploy:
    desc: "Deploy private DNS onto an already prepared foundation"
    cmds:
      - task: tools:kustomize
      - test/internaldns/kubernetes/deploy.sh

  env:internal-dns:qualify:
    desc: "Qualify private DNS through scoped product APIs and Kubernetes serving pods"
    cmds:
      - go run ./test/internaldns/kubernetes/qualify --environment .internal-dns-e2e/kubernetes/environment.json --results test/internaldns/results/kubernetes.json

  env:internal-dns:package:
    desc: "Build and qualify the internal DNS runtime image and deployment contracts"
    cmds:
      - task: test:internal-dns-package

  vuln-scan:
    desc: Scan dependencies for known vulnerabilities, the same way CI does
    # Needs bash, git, curl, and jq, plus go for Go modules, and python3 3.11
    # or later (for tomllib) when the repository has an osv-scanner.toml.
    vars:
      # The ref, a tag or a commit SHA, on the uses: line that calls
      # vuln-scan.yaml in .github/workflows. When Renovate bumps that line,
      # the local scan moves with it.
      ACTIONS_REF:
        sh: |
          grep -rhoE "datum-cloud/actions/\.github/workflows/vuln-scan\.yaml@[^[:space:]\"'#]+" \
            "{{.ROOT_DIR}}/.github/workflows" 2> /dev/null | sed 's/.*@//' | sort -u | paste -sd ' ' -
      # Scripts are cached per commit, so a tag that is moved to another
      # commit is fetched again.
      COMMIT:
        sh: |
          case "{{.ACTIONS_REF}}" in
            "" | *" "*) ;;
            *[!0-9a-f]*) git ls-remote "{{.ACTIONS_REPO}}" "refs/tags/{{.ACTIONS_REF}}" "refs/tags/{{.ACTIONS_REF}}^{}" | tail -n 1 | cut -f 1 ;;
            *) echo "{{.ACTIONS_REF}}" ;;
          esac
      SCRIPTS:
        sh: echo "${XDG_CACHE_HOME:-$HOME/.cache}/datum-vuln-scan/scripts/{{.COMMIT}}"
    cmds:
      - test -n "{{.ACTIONS_REF}}" || (echo "no workflow in .github/workflows calls datum-cloud/actions/.github/workflows/vuln-scan.yaml" >&2; exit 1)
      - case "{{.ACTIONS_REF}}" in *" "*) echo "workflows call vuln-scan.yaml at different refs ({{.ACTIONS_REF}}); use one" >&2; exit 1 ;; esac
      - test -n "{{.COMMIT}}" || (echo "{{.ACTIONS_REPO}} has no tag {{.ACTIONS_REF}}" >&2; exit 1)
      - task: vuln-scan:fetch
        vars: { COMMIT: "{{.COMMIT}}", SCRIPTS: "{{.SCRIPTS}}" }
      - bash "{{.SCRIPTS}}/scripts/vuln-scan/run.sh"

  vuln-scan:fetch:
    internal: true
    status:
      - test -f "{{.SCRIPTS}}/scripts/vuln-scan/run.sh"
    cmds:
      - rm -rf "{{.SCRIPTS}}.tmp"
      - git -c init.defaultBranch=main init --quiet "{{.SCRIPTS}}.tmp"
      - git -C "{{.SCRIPTS}}.tmp" sparse-checkout set --no-cone '/scripts/vuln-scan/*.sh' '/scripts/vuln-scan/*.py'
      - git -C "{{.SCRIPTS}}.tmp" fetch --quiet --depth 1 "{{.ACTIONS_REPO}}" "{{.COMMIT}}"
      - git -C "{{.SCRIPTS}}.tmp" checkout --quiet FETCH_HEAD
      - mv "{{.SCRIPTS}}.tmp" "{{.SCRIPTS}}"

  default:
    desc: "Show available commands"
    silent: true
    cmds:
      - echo "DNS platform local environment (upstream replicator + control + edge federation):"
      - echo "  task env:up          Bring up upstream + control + edge clusters, deploy a sample zone"
      - echo "  task env:stack-up    Bring up the full chain with no sample data (used by CI)"
      - echo "  task env:chainsaw    Run the full Chainsaw e2e suite against the environment"
      - echo "  task env:down        Tear down all clusters"
      - echo "  task env:internal-dns:up       Deploy private DNS on the shared clusters"
      - echo "  task env:internal-dns:qualify  Validate private DNS publication and isolation"
      - echo "  task env:dns-check   Query control + edge PowerDNS for the sample record"
      - echo "  task vuln-scan       Scan dependencies for known vulnerabilities, as CI does"
      - echo "  task ci              Run every check CI runs on this machine"
      - echo "  task e2e             Bring up the environment and run every end-to-end suite"
      - echo "  task test            Run the Go tests under envtest"
      - echo "  task lint            Run golangci-lint"
      - echo "  task --list-all      List every task, including build, deploy, kind, and tool tasks"
      - echo ""
      - echo "Individual pieces:"
      - echo "  task env:control-up  Control cluster only (dns-operator + PowerDNS + RustFS)"
      - echo "  task env:edge-up     Edge cluster only (PowerDNS, replicates from control)"
      - echo "  task env:upstream-up Upstream cluster only (replicator, pushes to control)"
      - echo ""
      - echo "Underlying test-infra tasks are available as test-infra:<name>, e.g.:"
      - echo "  task test-infra:kubectl -- get pods --all-namespaces"

  env:rustfs-up:
    desc: "Deploy RustFS (S3-compatible object store) into the control cluster via Flux"
    silent: true
    cmds:
      - echo "➡️  Installing RustFS into kind-{{.CONTROL_CLUSTER_NAME}}..."
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} apply -k config/dependencies/rustfs
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n rustfs-system wait helmrelease/rustfs --for=condition=Ready --timeout=300s
      - |
        set -euo pipefail
        export KUBECONFIG={{.ENV_KUBECONFIG}}
        mkdir -p dev
        SVC=$(kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} get svc -n rustfs-system -l app.kubernetes.io/instance=rustfs -o jsonpath='{.items[0].metadata.name}')
        kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n rustfs-system wait --for=jsonpath='{.spec.ports[0].nodePort}' svc/$SVC --timeout=60s
        PORT=$(kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} get svc -n rustfs-system $SVC -o jsonpath='{.spec.ports[0].nodePort}')
        echo "$PORT" > {{.RUSTFS_NODEPORT_FILE}}
        echo "✅ RustFS ready: svc/$SVC, NodePort=$PORT (recorded to {{.RUSTFS_NODEPORT_FILE}})"
      # RustFS (like any S3-compatible store) does not auto-create buckets,
      # and the pinned chart version predates its `setup.buckets` hook (see
      # config/dependencies/rustfs/helmrelease.yaml) - so create the bucket
      # Lightningstream syncs snapshots through ourselves, via a one-off pod.
      # Without this, lightningstream just polls forever logging
      # "list snapshots: Volume not found" and never actually syncs.
      - |
        set -euo pipefail
        export KUBECONFIG={{.ENV_KUBECONFIG}}
        kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n rustfs-system delete pod rustfs-mb --ignore-not-found
        kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n rustfs-system run rustfs-mb \
          --image=amazon/aws-cli:2.17.62 --restart=Never \
          --env=AWS_ACCESS_KEY_ID=dns-federation --env=AWS_SECRET_ACCESS_KEY=dns-federation-secret \
          --command -- \
          sh -c "aws --endpoint-url http://rustfs.rustfs-system.svc.cluster.local:9000 s3 mb s3://{{.RUSTFS_BUCKET}} --region us-east-1 || true"
        kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n rustfs-system wait --for=jsonpath='{.status.phase}'=Succeeded pod/rustfs-mb --timeout=60s
        echo "✅ RustFS bucket '{{.RUSTFS_BUCKET}}' ready"

  # internal: writes/updates the s3-credentials Secret dns-operator's agent
  # (see config/agent/manager.yaml) reads its Lightningstream S3 config from.
  env:s3-secret:
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG={{.ENV_KUBECONFIG}}
        kubectl --context {{.CONTEXT}} create namespace dns-agent-system --dry-run=client -o yaml | kubectl --context {{.CONTEXT}} apply -f -
        kubectl --context {{.CONTEXT}} -n dns-agent-system create secret generic s3-credentials \
          --from-literal=accesskey=dns-federation \
          --from-literal=secretkey=dns-federation-secret \
          --from-literal=endpoint_url={{.ENDPOINT_URL}} \
          --from-literal=bucket={{.RUSTFS_BUCKET}} \
          --from-literal=region=us-east-1 \
          --from-literal=cluster_id={{.CLUSTER_ID}}- \
          --dry-run=client -o yaml | kubectl --context {{.CONTEXT}} apply -f -
        echo "✅ s3-credentials set in {{.CONTEXT}}: endpoint_url={{.ENDPOINT_URL}}"

  # internal: brings up a test-infra-managed kind cluster (kind cluster +
  # Flux + cert-manager + Kyverno + Envoy Gateway) for CLUSTER_NAME.
  #
  # Invoke bootstrap sub-tasks directly to pass cluster variables explicitly
  # and avoid the composite task's informational command parsing errors.
  env:test-infra-cluster-up:
    internal: true
    cmds:
      - task: test-infra:ensure-repo
        vars:
          CLUSTER_NAME: "{{.CLUSTER_NAME}}"
      - task: test-infra:ensure-tools
        vars:
          CLUSTER_NAME: "{{.CLUSTER_NAME}}"
      - task: test-infra:create-kind
        vars:
          CLUSTER_NAME: "{{.CLUSTER_NAME}}"
          KIND_CFG: '{{.KIND_CFG | default ".test-infra/cluster/kind-config.yaml"}}'
      - task: test-infra:install-components
        vars:
          CLUSTER_NAME: "{{.CLUSTER_NAME}}"
      # test-infra's create-kind writes the cluster's kubeconfig to its own
      # KUBECONFIG_FILE (e.g. .test-infra/kubeconfig when run from an
      # external repo like this one) via `kind create cluster --kubeconfig
      # <file>`, which does NOT merge a kind-<name> context into the
      # default kubeconfig. Every other task in this Taskfile (and the
      # tasks it calls) assumes the standard `kubectl --context
      # kind-<name>` convention, so re-export/merge it into the default
      # kubeconfig here - into our own dedicated ENV_KUBECONFIG file (not the
      # default ~/.kube/config, which is subject to the same leaked-env risk
      # via kind's own default KUBECONFIG resolution). Every subsequent cmd
      # in this Taskfile explicitly sets KUBECONFIG to ENV_KUBECONFIG too.
      - kind export kubeconfig --name {{.CLUSTER_NAME}} --kubeconfig {{.ENV_KUBECONFIG}}

  env:control-up:
    desc: "Prepare the control cluster and deploy DNS"
    cmds:
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.CONTROL_CLUSTER_NAME}}"
      - task: env:control-deploy

  env:control-deploy:
    desc: "Deploy dns-operator + PowerDNS + RustFS"
    cmds:
      - task: env:rustfs-up
      - task: env:public-image-build
      - task: kind-load-existing-image
        vars:
          CLUSTER: "{{.CONTROL_CLUSTER_NAME}}"
          IMG: "{{.IMG}}"
      - task: install-dns-operator-crds
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.CONTROL_CLUSTER_NAME}}"
      - task: env:s3-secret
        vars:
          CONTEXT: "kind-{{.CONTROL_CLUSTER_NAME}}"
          CLUSTER_ID: "{{.CONTROL_CLUSTER_NAME}}"
          ENDPOINT_URL:
            sh: |
              export KUBECONFIG={{.ENV_KUBECONFIG}}
              SVC=$(kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} get svc -n rustfs-system -l app.kubernetes.io/instance=rustfs -o jsonpath='{.items[0].metadata.name}')
              echo "http://$SVC.rustfs-system.svc.cluster.local:9000"
      - task: kustomize-apply
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.CONTROL_CLUSTER_NAME}}"
          KUSTOMIZE_DIR: '{{if eq .DNS_E2E_SHARED_PREREQUISITES "1"}}config/overlays/agent-powerdns-federated-ci{{else}}config/overlays/agent-powerdns-federated{{end}}'
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n dns-agent-system rollout status statefulset/pdns-auth --timeout=120s
      - echo "✅ control cluster (kind-{{.CONTROL_CLUSTER_NAME}}) ready"

  env:edge-up:
    desc: "Prepare the edge cluster and deploy DNS"
    cmds:
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.EDGE_CLUSTER_NAME}}"
      - task: env:edge-deploy

  env:edge-deploy:
    desc: "Deploy PowerDNS pointed at the control cluster's RustFS"
    cmds:
      - |
        if [ ! -f {{.RUSTFS_NODEPORT_FILE}} ]; then
          echo "❌ {{.RUSTFS_NODEPORT_FILE}} not found - run 'task env:control-up' first"
          exit 1
        fi
      - task: env:public-image-build
      - task: kind-load-existing-image
        vars:
          CLUSTER: "{{.EDGE_CLUSTER_NAME}}"
          IMG: "{{.IMG}}"
      - task: install-dns-operator-crds
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.EDGE_CLUSTER_NAME}}"
      - task: env:s3-secret
        vars:
          CONTEXT: "kind-{{.EDGE_CLUSTER_NAME}}"
          CLUSTER_ID: "{{.EDGE_CLUSTER_NAME}}"
          ENDPOINT_URL:
            sh: echo "http://{{.CONTROL_CLUSTER_NAME}}-control-plane:$(cat {{.RUSTFS_NODEPORT_FILE}})"
      - task: kustomize-apply
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.EDGE_CLUSTER_NAME}}"
          KUSTOMIZE_DIR: '{{if eq .DNS_E2E_SHARED_PREREQUISITES "1"}}config/overlays/agent-powerdns-federated-ci{{else}}config/overlays/agent-powerdns-federated{{end}}'
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.EDGE_CLUSTER_NAME}} -n dns-agent-system rollout status statefulset/pdns-auth --timeout=120s
      - echo "✅ edge cluster (kind-{{.EDGE_CLUSTER_NAME}}) ready"

  env:upstream-up:
    desc: "Prepare the upstream cluster and deploy DNS"
    cmds:
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.UPSTREAM_CLUSTER_NAME}}"
      - task: env:upstream-deploy

  env:upstream-deploy:
    desc: "Deploy the replicator pointed at the control (downstream agent) cluster"
    cmds:
      - task: env:public-image-build
      - task: kind-load-existing-image
        vars:
          CLUSTER: "{{.UPSTREAM_CLUSTER_NAME}}"
          IMG: "{{.IMG}}"
      - task: install-dns-operator-crds
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.UPSTREAM_CLUSTER_NAME}}"
      # The replicator's manager watches networking-services types (Domain,
      # etc.) in addition to DNS resources; install those CRDs so its
      # controllers start cleanly (mirrors `task bootstrap-upstream`).
      - task: install-networking-crds
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.UPSTREAM_CLUSTER_NAME}}"
      # The replicator reaches the control cluster's API (its "downstream")
      # through a kubeconfig Secret. Export control's kubeconfig rewritten to
      # the control-plane container's in-network address (host:6443, TLS-skip)
      # so it is reachable from the upstream cluster's pods over the shared
      # kind docker network - the same cross-cluster addressing env:edge-up
      # already uses for RustFS.
      - task: export-kind-kubeconfig
        vars:
          CLUSTER: "{{.CONTROL_CLUSTER_NAME}}"
          OUT: "{{.CONTROL_INCLUSTER_KUBECONFIG}}"
          KIND_KUBECONFIG_INSECURE: "true"
      - |
        set -euo pipefail
        export KUBECONFIG={{.ENV_KUBECONFIG}}
        kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} create namespace dns-replicator-system --dry-run=client -o yaml | kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} apply -f -
      - task: secret-from-file
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.UPSTREAM_CLUSTER_NAME}}"
          NAMESPACE: "dns-replicator-system"
          NAME: "downstream-kubeconfig"
          KEY: "kubeconfig"
          FILE: "{{.CONTROL_INCLUSTER_KUBECONFIG}}"
      - task: kustomize-apply
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.UPSTREAM_CLUSTER_NAME}}"
          KUSTOMIZE_DIR: '{{if eq .DNS_E2E_SHARED_PREREQUISITES "1"}}config/overlays/replicator-ci{{else}}config/overlays/replicator{{end}}'
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} -n dns-replicator-system rollout status deployment/dns-operator-controller-manager --timeout=180s
      - echo "✅ upstream cluster (kind-{{.UPSTREAM_CLUSTER_NAME}}) ready"

  env:stack-up:
    desc: "Prepare the foundation and deploy the public DNS chain (no sample data)"
    cmds:
      - task: env:foundation-up
      - task: env:stack-deploy

  env:stack-deploy:
    desc: "Deploy public DNS onto an already prepared foundation"
    cmds:
      # Order matters: the replicator (upstream) needs the control cluster
      # reachable, and edge needs control's RustFS NodePort, so control comes
      # up first, then edge, then upstream.
      - task: env:control-deploy
      - task: env:edge-deploy
      - task: env:upstream-deploy

  env:up:
    desc: "Bring up the full local DNS federation environment (upstream + control + edge) with sample data"
    cmds:
      - task: env:stack-up
      # Dev convenience only: this applies the sample directly on the control
      # cluster to smoke-test the control->edge Lightningstream path. CI uses
      # env:stack-up instead and drives the full upstream->edge chain through
      # the Chainsaw suites (see env:chainsaw), so it never applies this - the
      # sample's example.com zone would otherwise collide with the
      # zones-and-records suite on the shared control PowerDNS.
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} apply -f config/samples/federation/dnszone-example.yaml
      - echo ""
      - echo "🎉 Environment up. upstream=kind-{{.UPSTREAM_CLUSTER_NAME}} control=kind-{{.CONTROL_CLUSTER_NAME}} edge=kind-{{.EDGE_CLUSTER_NAME}}"
      - echo "   Lightningstream syncs on an interval - give it a few seconds, then:"
      - echo "   task env:dns-check"

  env:dns-check:
    desc: "Query both control and edge PowerDNS for the sample www.example.com record"
    cmds:
      - echo "🔎 control (kind-{{.CONTROL_CLUSTER_NAME}}):"
      - task: dns-debug
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          DNS_DEBUG_CONTEXT: "kind-{{.CONTROL_CLUSTER_NAME}}"
          DNS_DEBUG_ZONE: "example.com"
          DNS_DEBUG_HOST: "www"
      - echo "🔎 edge (kind-{{.EDGE_CLUSTER_NAME}}) - should match control once Lightningstream syncs:"
      - task: dns-debug
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          DNS_DEBUG_CONTEXT: "kind-{{.EDGE_CLUSTER_NAME}}"
          DNS_DEBUG_ZONE: "example.com"
          DNS_DEBUG_HOST: "www"

  env:chainsaw-prepare-kubeconfigs:
    desc: "Export upstream/control/edge kind kubeconfigs into test/e2e/ for the Chainsaw suites"
    cmds:
      - task: export-kind-kubeconfig-raw
        vars:
          CLUSTER: "{{.UPSTREAM_CLUSTER_NAME}}"
          OUT: "test/e2e/kubeconfig-upstream"
      # The control cluster is addressed as "downstream" by the replicator
      # suites and as "control" by the federation/full-chain suites, so export
      # its kubeconfig under both names.
      - task: export-kind-kubeconfig-raw
        vars:
          CLUSTER: "{{.CONTROL_CLUSTER_NAME}}"
          OUT: "test/e2e/kubeconfig-downstream"
      - task: export-kind-kubeconfig-raw
        vars:
          CLUSTER: "{{.CONTROL_CLUSTER_NAME}}"
          OUT: "test/e2e/kubeconfig-control"
      - task: export-kind-kubeconfig-raw
        vars:
          CLUSTER: "{{.EDGE_CLUSTER_NAME}}"
          OUT: "test/e2e/kubeconfig-edge"
      - echo "✅ wrote test/e2e/kubeconfig-{upstream,downstream,control,edge}"

  env:chainsaw:
    desc: "Run the full Chainsaw e2e suite (replicator + federation + full-chain) against the environment"
    deps:
      - env:chainsaw-prepare-kubeconfigs
      - tools:chainsaw
    cmds:
      # Chainsaw needs *a* default KUBECONFIG to initialize its client even
      # though each suite addresses its clusters by name (spec.clusters) -
      # point it at the control kubeconfig we just exported. `.` runs every
      # suite under test/e2e (alias, display-annotations, zones-and-records,
      # federation, full-chain).
      #
      # The drift suites deliberately live outside this tree, in test/e2e-drift:
      # they need the Milo environment and the kubeconfigs that only
      # env:chainsaw-milo builds, and `.` would otherwise discover them here.
      - cd test/e2e && KUBECONFIG=kubeconfig-control {{.TOOL_DIR}}/chainsaw test .

  env:down:
    desc: "Tear down all clusters (upstream + control + edge)"
    cmds:
      - task: test-infra:delete-kind
        vars:
          CLUSTER_NAME: "{{.UPSTREAM_CLUSTER_NAME}}"
      # NOTE: calling the leaf `delete-kind` task directly (not the
      # `cluster-down`/`down` wrapper) - go-task does not forward
      # caller-supplied `vars:` through a wrapper task's own un-parameterized
      # `task:` calls, so `test-infra:cluster-down vars: {CLUSTER_NAME: ...}`
      # silently falls back to CLUSTER_NAME's taskfile-level default
      # ("test-infra") instead of deleting the cluster we actually created.
      # Same reasoning as env:test-infra-cluster-up above.
      - task: test-infra:delete-kind
        vars:
          CLUSTER_NAME: "{{.CONTROL_CLUSTER_NAME}}"
      - task: test-infra:delete-kind
        vars:
          CLUSTER_NAME: "{{.EDGE_CLUSTER_NAME}}"
      - rm -f {{.RUSTFS_NODEPORT_FILE}} {{.ENV_KUBECONFIG}} {{.CONTROL_INCLUSTER_KUBECONFIG}}

  # ---- Milo control-plane (drift-detection / Phase B) --------------------
  # Installs the Milo apiserver + controller-manager into the control cluster
  # via Flux, so the replicator can run discovery.mode=milo and resource-metrics
  # can collect project + core control planes. See config/dependencies/milo and
  # docs/enhancements/controlplane-drift-detection.md.
  env:milo-up:
    desc: "Install Milo (apiserver + controller-manager) into the control cluster via Flux"
    silent: true
    cmds:
      - echo "➡️  Installing Milo into kind-{{.CONTROL_CLUSTER_NAME}}..."
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} apply -k config/dependencies/milo
      - echo "⏳ waiting for Flux OCIRepository 'milo' to reconcile..."
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n flux-system wait ocirepository/milo --for=condition=Ready --timeout=180s
      - echo "⏳ waiting for Flux Kustomization 'milo-infra-crds'..."
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n flux-system wait kustomization/milo-infra-crds --for=condition=Ready --timeout=300s
      - echo "⏳ waiting for Flux Kustomization 'milo' (cold start applies CRDs + deploys apiserver, up to 10m)..."
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n flux-system wait kustomization/milo --for=condition=Ready --timeout=600s
      - echo "✅ Milo installed. milo-system objects:"
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n milo-system get pods,svc

  env:derisk-control-milo:
    desc: "De-risk: bring up ONLY the control cluster + Milo (no agent/rustfs) to inspect the live milo-apiserver"
    cmds:
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.CONTROL_CLUSTER_NAME}}"
      - task: env:milo-up

  # internal: mint an admin kubeconfig for the Milo core CP via a transient
  # port-forward, then run CMD (a kubectl invocation with KUBECONFIG=$mk).
  # milo-apiserver's NodePort is not host-mapped, and on macOS the host cannot
  # reach the kind docker-network IP, so a port-forward is the portable way to
  # drive the core CP from the host (macOS dev + Linux CI).
  env:with-milo-admin:
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail
        export KUBECONFIG={{.ENV_KUBECONFIG}}
        kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n milo-system port-forward svc/milo-apiserver 16443:6443 >/tmp/milo-pf.log 2>&1 &
        pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do
          curl -sk -o /dev/null -m 2 https://127.0.0.1:16443/livez && break || sleep 1
        done
        mk={{.MILO_ADMIN_KUBECONFIG}}
        kubectl config --kubeconfig="$mk" set-cluster milo --server=https://127.0.0.1:16443 --insecure-skip-tls-verify=true >/dev/null
        kubectl config --kubeconfig="$mk" set-credentials admin --token=test-admin-token >/dev/null
        kubectl config --kubeconfig="$mk" set-context milo --cluster=milo --user=admin >/dev/null
        kubectl config --kubeconfig="$mk" use-context milo >/dev/null
        KUBECONFIG="$mk" {{.CMD}}

  env:observability-up:
    desc: "Install the observability stack (Victoria Metrics + OTel + Prometheus CRDs) into the control cluster"
    cmds:
      - KUBECONFIG={{.ENV_KUBECONFIG}} TASK_X_REMOTE_TASKFILES=1 task --yes test-infra:install-observability

  env:metrics-up:
    desc: "Deploy both resource-metrics collectors (upstream mode:milo, downstream mode:single), their policies, and the drift rules"
    vars:
      KCTL: KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.CONTROL_CLUSTER_NAME}}
    cmds:
      # Two collectors, because the two replication seams are two API servers:
      #   controller/  mode:milo   — engages every project CP, reads its policy
      #                              from the Milo core CP  -> upstream series
      #   downstream/  mode:single — collects dns-control's own apiserver, where
      #                              the replicator writes the shadow objects,
      #                              and reads its policy from there
      #                                                     -> downstream series
      # All Flux objects live on the LOCAL (dns-control) cluster; only the core
      # CP Kustomization targets a different API server, via kubeConfig. Every
      # manifest comes from resource-metrics' published bundle (no vendored
      # manifests, no local image build — the pin ships a multi-arch image).
      - "{{.KCTL}} apply -k config/dependencies/resource-metrics/controller"
      - "{{.KCTL}} apply -k config/dependencies/resource-metrics/core-control-plane/crd"
      - "{{.KCTL}} apply -k config/dependencies/resource-metrics/downstream"
      - "{{.KCTL}} -n flux-system wait ocirepository/resource-metrics --for=condition=Ready --timeout=120s"
      # Installs the ResourceMetricsPolicy CRD onto each cluster from the bundle.
      - "{{.KCTL}} -n flux-system wait kustomization/resource-metrics-crd --for=condition=Ready --timeout=180s"
      - "{{.KCTL}} -n flux-system wait kustomization/resource-metrics-downstream-crd --for=condition=Ready --timeout=180s"
      # Each policy goes to the cluster whose collector reads it, once that
      # cluster's CRD is Established. dns-metrics is the same policy infra ships
      # to production; dns-downstream-metrics is drift-detection specific.
      # Applied as a plain file, not with `apply -k` on
      # config/dependencies/resource-metrics/core-control-plane/policy: that
      # kustomization references the policy outside its own root, which needs
      # --load-restrictor LoadRestrictionsNone, and `kubectl apply -k` has no way
      # to pass it. The kustomization stays as the reference for how infra wires
      # this; here we apply what it points at.
      - task: env:with-milo-admin
        vars:
          CMD: kubectl apply -f config/milo/resource-metrics/policies/dns-metrics.yaml
      - "{{.KCTL}} apply -k config/observability/cluster-policy"
      - "{{.KCTL}} -n flux-system wait kustomization/resource-metrics --for=condition=Ready --timeout=300s"
      - "{{.KCTL}} -n flux-system wait kustomization/resource-metrics-downstream --for=condition=Ready --timeout=300s"
      # Same deployment name in both cases — the two collectors are told apart by
      # namespace, not by name.
      - "{{.KCTL}} -n resource-metrics-system rollout status deploy/resource-metrics-controller-manager --timeout=150s"
      - "{{.KCTL}} -n resource-metrics-downstream-system rollout status deploy/resource-metrics-controller-manager --timeout=150s"
      - "{{.KCTL}} -n telemetry-system apply -k config/observability/rules"
      - echo "✅ upstream + downstream resource-metrics, both policies, and the drift rules deployed"

  env:milo-all-up:
    desc: "Full clean bring-up: control+Milo, CRDs+projects, observability, resource-metrics, upstream replicator"
    cmds:
      - task: env:derisk-control-milo
      - task: env:milo-bootstrap
      - task: env:observability-up
      - task: env:metrics-up
      - task: env:upstream-milo-up

  env:chainsaw-milo:
    desc: "Run the control-plane drift Chainsaw suite (happy-path/orphan/missing) against the running Milo env"
    deps:
      - tools:chainsaw
    cmds:
      - |
        set -euo pipefail
        root="$(pwd)"
        cd test/e2e-drift
        # infra + downstream are both the dns-control kind API: it hosts VM/OTel
        # and it is also where the replicator writes the shadow objects. They
        # get separate kubeconfigs so each scenario reads as what it is doing.
        # replicator = dns-upstream kind. All kind APIs are host-reachable.
        kind get kubeconfig --name {{.CONTROL_CLUSTER_NAME}} > kubeconfig-infra
        cp kubeconfig-infra kubeconfig-downstream
        kind get kubeconfig --name {{.UPSTREAM_CLUSTER_NAME}} > kubeconfig-replicator
        # alpha (project CP): reach milo-apiserver via a localhost port-forward —
        # portable across macOS + Linux, since the gateway NodePort is not
        # host-mapped and macOS can't reach the kind docker-network IP directly.
        KUBECONFIG="$root/{{.ENV_KUBECONFIG}}" kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} \
          -n milo-system port-forward svc/milo-apiserver 16443:6443 >/tmp/milo-pf-chainsaw.log 2>&1 &
        pf=$!; trap 'kill $pf 2>/dev/null || true' EXIT
        for i in $(seq 1 30); do curl -sk -o /dev/null -m2 https://127.0.0.1:16443/livez && break || sleep 1; done
        kubectl config --kubeconfig=kubeconfig-alpha set-credentials a --token=test-admin-token >/dev/null
        kubectl config --kubeconfig=kubeconfig-alpha set-context alpha --cluster=alpha --user=a >/dev/null
        kubectl config --kubeconfig=kubeconfig-alpha use-context alpha >/dev/null
        kubectl config --kubeconfig=kubeconfig-alpha set-cluster alpha \
          --server=https://127.0.0.1:16443/apis/resourcemanager.miloapis.com/v1alpha1/projects/alpha/control-plane \
          --insecure-skip-tls-verify=true >/dev/null
        KUBECONFIG=kubeconfig-infra {{.TOOL_DIR}}/chainsaw test --config .chainsaw.yaml {{.CHAINSAW_SUITE | default "."}}

  env:upstream-milo-up:
    desc: "Create dns-upstream and deploy the replicator (discovery.mode=milo, 2 replicas): discovery via Milo, shadow objects to dns-control's apiserver"
    cmds:
      - task: env:test-infra-cluster-up
        vars:
          CLUSTER_NAME: "{{.UPSTREAM_CLUSTER_NAME}}"
      - kind load docker-image {{.DNSOP_IMG}} --name {{.UPSTREAM_CLUSTER_NAME}}
      # Mint the cross-cluster milo kubeconfig (control node IP + gateway
      # NodePort) and stash it as the milo-kubeconfig Secret the replicator-milo
      # overlay mounts at /milo. NODE_IP via python to avoid go-task/docker
      # template brace conflicts.
      - |
        set -euo pipefail
        export KUBECONFIG={{.ENV_KUBECONFIG}}
        NODE_IP=$(docker inspect {{.CONTROL_CLUSTER_NAME}}-control-plane | python3 -c "import json,sys; n=json.load(sys.stdin)[0]['NetworkSettings']['Networks']; print(next(iter(n.values()))['IPAddress'])")
        # Derive the envoy gateway NodePort dynamically — test-infra's
        # fix/remove-hardcoded-nodeports branch assigns it per-cluster, so it is
        # NOT stable across rebuilds. Look up the nodePort mapped to gateway
        # port 8443 (the HTTPS listener that fronts milo-apiserver).
        NODEPORT=$(kubectl --context kind-{{.CONTROL_CLUSTER_NAME}} -n envoy-gateway-system get svc \
          -o jsonpath='{range .items[*]}{range .spec.ports[?(@.port==8443)]}{.nodePort}{end}{end}')
        test -n "$NODEPORT" || { echo "could not resolve envoy gateway 8443 NodePort" >&2; exit 1; }
        echo "➡️  milo gateway endpoint for replicator: https://${NODE_IP}:${NODEPORT}"
        mk={{.MILO_UPSTREAM_KUBECONFIG}}
        kubectl config --kubeconfig="$mk" set-cluster milo --server="https://${NODE_IP}:${NODEPORT}" --insecure-skip-tls-verify=true >/dev/null
        kubectl config --kubeconfig="$mk" set-credentials admin --token=test-admin-token >/dev/null
        kubectl config --kubeconfig="$mk" set-context milo --cluster=milo --user=admin >/dev/null
        kubectl config --kubeconfig="$mk" use-context milo >/dev/null
        kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} create ns dns-replicator-system --dry-run=client -o yaml | kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} apply -f -
        kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} -n dns-replicator-system create secret generic milo-kubeconfig --from-file=kubeconfig="$mk" --dry-run=client -o yaml | kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} apply -f -
      # Milo is only half the replicator's wiring: the shadow objects go to
      # dns-control's own apiserver, a different API server than milo-apiserver.
      # Export control's kubeconfig rewritten to the control-plane container's
      # in-network address so pods on dns-upstream can reach it over the shared
      # kind docker network — the same mechanism env:upstream-up uses.
      - task: export-kind-kubeconfig
        vars:
          CLUSTER: "{{.CONTROL_CLUSTER_NAME}}"
          OUT: "{{.CONTROL_INCLUSTER_KUBECONFIG}}"
          KIND_KUBECONFIG_INSECURE: "true"
      - task: secret-from-file
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.UPSTREAM_CLUSTER_NAME}}"
          NAMESPACE: "dns-replicator-system"
          NAME: "downstream-kubeconfig"
          KEY: "kubeconfig"
          FILE: "{{.CONTROL_INCLUSTER_KUBECONFIG}}"
      - task: kustomize-apply
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.UPSTREAM_CLUSTER_NAME}}"
          KUSTOMIZE_DIR: "config/overlays/replicator-milo"
      - KUBECONFIG={{.ENV_KUBECONFIG}} kubectl --context kind-{{.UPSTREAM_CLUSTER_NAME}} -n dns-replicator-system rollout status deploy/dns-operator-controller-manager --timeout=180s
      - echo "✅ replicator up on kind-{{.UPSTREAM_CLUSTER_NAME}} (mode=milo, 2 replicas)"

  env:milo-bootstrap:
    desc: "Install DNS + networking CRDs into the Milo core CP and the downstream cluster, and create the drift Org + projects (alpha, beta)"
    cmds:
      - task: env:with-milo-admin
        vars:
          CMD: kubectl apply -k config/crd
      # The DNS CRDs are needed on BOTH seams: the core CP shares them with every
      # project CP (upstream), and dns-control's own apiserver stores the shadow
      # objects the replicator writes (downstream). Production installs the
      # downstream copy through the agent bundle, which pulls in config/crd.
      - task: install-dns-operator-crds
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.CONTROL_CLUSTER_NAME}}"
      # The replicator (dnszone/dnszonediscovery controllers) indexes Domain
      # (networking.datumapis.com); without its CRD, project-CP engagement fails
      # on cache-index setup. Generate the networking CRDs and install them into
      # the core CP (shared to all project CPs). The task also applies to
      # the local kind API (harmless) and writes dev/crds/network-services.
      - task: install-networking-crds
        vars:
          KUBECONFIG: "{{.ENV_KUBECONFIG}}"
          CONTEXT: "kind-{{.CONTROL_CLUSTER_NAME}}"
      - task: env:with-milo-admin
        vars:
          CMD: kubectl apply -f dev/crds/network-services
      - task: env:with-milo-admin
        vars:
          CMD: kubectl apply -f test/e2e-drift/fixtures/milo-projects.yaml
      - task: env:with-milo-admin
        vars:
          CMD: kubectl wait --for=condition=Ready project/alpha project/beta --timeout=120s
      - echo "✅ Milo core CP has DNS + networking CRDs; projects alpha, beta are Ready"
