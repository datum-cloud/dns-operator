-- Query front door. Authoritative listens on loopback :5301 (recursor is :5300).
-- dnsdist owns UDP/TCP :53; the Kubernetes Service still targets that port.

setACL({"0.0.0.0/0", "::/0"})
setLocal("0.0.0.0:53")
-- IPv6 is optional: some kind clusters have no routable IPv6.
pcall(addLocal, "[::]:53")

newServer({
  address = "127.0.0.1:5301",
  name = "pdns-auth",
  -- Single sidecar backend: skip health-check probes. If Auth is down, queries
  -- fail closed rather than dnsdist marking the only pool member down.
  healthCheckMode = "up",
})

-- dnstap Frame Stream client. Vector (or another fstrm listener) must bind
-- /run/dnsdist/dnstap.sock; reopenInterval retries until that listener exists
-- so this process can start without it.
local identity = os.getenv("POD_NAME") or "pdns-auth"
local dnstap = newFrameStreamUnixLogger("/run/dnsdist/dnstap.sock", {
  reopenInterval = 1,
})
addAction(AllRule(), DnstapLogAction(identity, dnstap))
addResponseAction(AllRule(), DnstapLogResponseAction(identity, dnstap))
