instance: ${LS_INSTANCE}

http:
  address: ":8500"

log:
  level: info
  format: human
  timestamp: short

lmdbs:
  main:
    path: /lmdb/db
    options:
      no_subdir: true
      create: true
    schema_tracks_changes: true
  shard:
    path: /lmdb/db-0
    options:
      no_subdir: true
      create: true
    schema_tracks_changes: true

storage:
  type: s3
  options:
    access_key: ${S3_ACCESS_KEY}
    secret_key: ${S3_SECRET_KEY}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    endpoint_url: ${S3_ENDPOINT_URL}
    use_update_marker: true

  cleanup:
    # Enable the cleaner
    enabled: true
    # Interval to check if snapshots need to be cleaned. Some perturbation
    # is added to this interval so that multiple instances started at exactly
    # the same time do not always try to clean the same snapshots at the same
    # time.
    interval: 1h
    # Snapshots must have been available for at least this interval before they
    # are considered for cleaning, so that slower instances have a chance to
    # download them.
    must_keep_interval: 24h
    # Remove stale instances without newer snapshots after this interval, but
    # only after we are sure this instance has downloaded and merged that
    # snapshot, and subsequently written a new snapshots that incorporates these
    # changes.
    #
    # Never longer than sweeper.retention_days below. A dead instance's last
    # snapshot still holds, as live, every row deleted after it died; kept past
    # the retention, it hands them back to any instance that loads it from
    # scratch, such as a new PoP pod.
    remove_old_instances_interval: 48h

# Reclaims LMDB entries whose tombstones aged past the retention. Not storage.cleanup
# above, which removes snapshots. Both estates read this file, so whether it runs comes
# from the container env; unset leaves it off.
#
# retention_days is not templated. An enabled sweeper with no retention set resolves to
# 0, which sweeps every tombstone at once and destroys the recovery window.
#
# Every snapshot carries every tombstone, and every PoP downloads every snapshot, so the
# retention sets most of the snapshot's size and of the bucket's download bill
# (datum-cloud/infra#6790). It is also the longest an instance may stay out of sync. A hub
# instance that rejoins later with its old LMDB publishes the rows deleted while it was
# away, and every instance takes them back (PowerDNS/lightningstream#90); empty its volume
# before it rejoins. A PoP out that long keeps serving them until its pod is recreated.
sweeper:
  enabled: ${LS_SWEEPER_ENABLED}
  retention_days: 2
