apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdns-auth
  namespace: system
  labels:
    control-plane: controller-agent
    app.kubernetes.io/name: pdns-auth
    app.kubernetes.io/managed-by: kustomize
spec:
  volumeClaimTemplates:
    - metadata:
        name: lmdb
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
  serviceName: pdns-auth-headless
  selector:
    matchLabels:
      control-plane: controller-agent
      app.kubernetes.io/name: pdns-auth
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-agent
        app.kubernetes.io/name: pdns-auth
    spec:
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: init-pdns-key
        image: busybox:1.36
        command: ["/bin/sh","-c"]
        args:
          - |
            set -euo pipefail
            mkdir -p /run/pdns
            umask 077
            KEY=$(head -c32 /dev/urandom | od -An -tx1 | tr -d " \n")
            printf "%s" "$KEY" > /run/pdns/api-key
            chmod 0440 /run/pdns/api-key
        volumeMounts:
        - name: pdns-shared
          mountPath: /run/pdns
        securityContext:
          runAsUser: 65532
      - name: init-dirs
        image: busybox:1.36
        command: ["/bin/sh","-c"]
        args:
          - |
            set -eu
            mkdir -p /lmdb
            chown -R 953:953 /lmdb
            chmod 0775 /lmdb
            # PDNS (auth + recursor) and dnsdist need writable runtime dirs on a
            # read-only root filesystem. dnsdist connects to a dnstap Frame Stream
            # socket that a listener (Vector) binds under /run/dnsdist.
            mkdir -p /run/pdns /run/pdns/recursor /run/dnsdist
            chown -R 953:953 /run/pdns /run/dnsdist
            chmod 0755 /run/pdns /run/pdns/recursor /run/dnsdist
            if [ -f /run/pdns/api-key ]; then chmod 0444 /run/pdns/api-key; fi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: lmdb
            mountPath: /lmdb
          - name: pdns-shared
            mountPath: /run/pdns
          - name: dnsdist-run
            mountPath: /run/dnsdist
      containers:
      - command:
        - /manager
        args:
          - --role=downstream
          - --leader-elect
          - --leader-elect-lease-duration=10s
          - --leader-elect-renew-deadline=3s
          - --leader-elect-retry-period=2s
          - --health-probe-bind-address=:8081
          - --metrics-bind-address=:8080
          - --metrics-secure=false
          - --server-config=/config/server-config.yaml
        env:
        - name: PDNS_API_URL
          value: http://localhost:8082
        - name: PDNS_API_KEY_FILE
          value: /run/pdns/api-key
        image: ghcr.io/datum-cloud/dns-operator:latest
        imagePullPolicy: IfNotPresent
        name: manager
        ports:
          - containerPort: 8080
            name: metrics
            protocol: TCP
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - name: server-config
          mountPath: /config
        - name: pdns-shared
          mountPath: /run/pdns
      - name: pdns
        image: powerdns/pdns-auth-51:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8082
            name: api
            protocol: TCP
        volumeMounts:
          - name: lmdb
            mountPath: /lmdb
          - name: pdns-shared
            mountPath: /run/pdns
          - name: pdns-config
            mountPath: /etc/powerdns
            readOnly: true
        command: ["/bin/sh","-c"]
        args:
          - |
            set -eu;
            exec pdns_server \
              --api-key="$(cat /run/pdns/api-key)" --api=yes --webserver-port=8082
        securityContext:
          # Auth binds loopback :5301 (unprivileged). Public :53 is dnsdist.
          runAsUser: 953
          runAsGroup: 953
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
      - name: dnsdist
        image: powerdns/dnsdist-20:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 53
            name: dns
            protocol: UDP
          - containerPort: 53
            name: dns-tcp
            protocol: TCP
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        command:
          - /usr/local/bin/dnsdist
        args:
          - --supervised
          - --disable-syslog
          - --uid
          - pdns
          - --gid
          - pdns
          - -C
          - /etc/dnsdist/dnsdist.conf
        volumeMounts:
          - name: dnsdist-config
            mountPath: /etc/dnsdist
            readOnly: true
          - name: dnsdist-run
            mountPath: /run/dnsdist
        securityContext:
          # NOTE: dnsdist must start as root (uid 0) despite `drop: ALL` +
          # `add: NET_BIND_SERVICE` below - Kubernetes/containerd does not
          # populate the Linux *ambient* capability set when translating
          # SecurityContext into the container's OCI spec, and without
          # ambient capabilities, added capabilities do NOT survive exec()
          # into a normal (non-file-capability) binary for a non-root UID -
          # see capabilities(7). Concretely: running this container as
          # `runAsUser: 953` with `capabilities.add: [NET_BIND_SERVICE]`
          # results in `dnsdist` getting Permission denied binding UDP/TCP
          # :53. Root is exempt from that exec-time capability-computation
          # rule, so we start as root and pass `--uid pdns --gid pdns` so
          # dnsdist drops after bind. SETUID/SETGID are added so that drop
          # works under `drop: ALL`.
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
            add: ["NET_BIND_SERVICE", "SETUID", "SETGID"]
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      - name: pdns-recursor
        image: powerdns/pdns-recursor-51:latest
        imagePullPolicy: IfNotPresent
        # Recursor is only used by pdns-auth via localhost for ALIAS expansion.
        ports:
          - containerPort: 8083
            name: recursor
            protocol: TCP
        command: ["/bin/sh","-c"]
        args:
          - |
            set -eu;
            exec pdns_recursor --config-dir=/etc/powerdns
        securityContext:
          runAsUser: 953
          runAsGroup: 953
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - "ALL"
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
          - name: pdns-shared
            mountPath: /run/pdns
          - name: pdns-config
            mountPath: /etc/powerdns
            readOnly: true
      - name: lightningstream
        image: powerdns/lightningstream:main
        imagePullPolicy: IfNotPresent
        command: ["lightningstream"]
        ports:
          - containerPort: 8500
            name: lmdb-metrics
            protocol: TCP
        args: ["--config", "/etc/lightningstream/lightningstream.yaml", "--minimum-pid", "50", "sync"]
        securityContext:
          runAsUser: 953
          runAsGroup: 953
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - "ALL"
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          # CLUSTER_ID disambiguates Lightningstream's per-instance identity
          # across separate clusters sharing one S3 bucket (see
          # config/overlays/agent-powerdns-federated + Taskfile.yaml
          # env:s3-secret). Pod name alone (e.g. "pdns-auth-0") is NOT
          # unique across clusters - the control and edge StatefulSets both
          # name their first replica "pdns-auth-0", so without this,
          # Lightningstream on both clusters reports the same LS_INSTANCE
          # and each treats the other's uploads as "its own", never
          # merging/replicating. Optional and empty by default so this base
          # stays a no-op for the single-cluster config/overlays/agent-powerdns
          # overlay, where pod name alone is already unique (multiple
          # replicas in one cluster/one bucket).
          - name: CLUSTER_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: cluster_id
                optional: true
          - name: LS_INSTANCE
            value: "$(CLUSTER_ID)$(POD_NAME)"
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: accesskey
                optional: true
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secretkey
                optional: true
          - name: S3_ENDPOINT_URL
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint_url
                optional: true
          - name: S3_BUCKET
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: bucket
                optional: true
          - name: S3_REGION
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: region
                optional: true
        volumeMounts:
          - name: lmdb
            mountPath: /lmdb
          - name: lightningstream-config
            mountPath: /etc/lightningstream      
      
      volumes:
      - name: server-config
        configMap:
          name: agent-server-config
      - name: pdns-shared
        emptyDir: {}
      - name: lightningstream-config
        configMap:
          name: lightningstream-config
      - name: pdns-config
        configMap:
          name: pdns-config
      - name: dnsdist-config
        configMap:
          name: dnsdist-config
      - name: dnsdist-run
        emptyDir: {}
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
