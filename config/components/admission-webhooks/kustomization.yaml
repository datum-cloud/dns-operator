# Cross-cluster admission registration for DNSRecordSet: display annotations
# (mutating) and owner name conflicts (validating). Applied to the
# control-plane apiserver via Flux; the webhook Service lives on the deployment
# cluster (datum-dns-system).
#
# NOT composed into config/default or operator overlays. Consume with the same
# OCIRepository semver as the manager image so registration cannot outrun the
# binary that serves the webhook (see github.com/datum-cloud/dns-operator#69).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - mutating-webhook-configuration.yaml
  - validating-webhook-configuration.yaml
