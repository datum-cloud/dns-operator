apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dns-operator-validating-webhook-configuration
webhooks:
  - name: vdnsrecordset.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: dns-operator-webhook-service
        namespace: datum-dns-system
        path: /validate-dns-networking-miloapis-com-v1alpha1-dnsrecordset
        port: 443
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 10
    rules:
      - apiGroups:
          - dns.networking.miloapis.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - dnsrecordsets
        scope: "*"
  # No /validate-internal-dns entry: in deployed environments the internal-dns
  # control plane serves and registers the private DNS reference checks
  # (config/internal-dns admission from #238, infra's internal-dns-admission). A second
  # fail-closed registration here would block those writes whenever either
  # server is unavailable. config/webhook keeps it for kind and e2e.
