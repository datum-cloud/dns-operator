# SPDX-License-Identifier: AGPL-3.0-only

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dns-operator-validating-webhook-configuration
webhooks:
  - name: vdnsrecordset.kb.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: dns-operator-webhook-service
        namespace: datum-dns-system
        path: /validate-dns-networking-miloapis-com-v1alpha1-dnsrecordset
        port: 443
    failurePolicy: Ignore
    matchPolicy: Equivalent
    sideEffects: None
    timeoutSeconds: 10
    rules:
      - apiGroups:
          - dns.networking.miloapis.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - dnsrecordsets
        scope: "*"
