apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: dns-mcp
    app.kubernetes.io/name: dns-mcp
  name: dns-mcp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-server
      app.kubernetes.io/instance: dns-mcp
      app.kubernetes.io/name: dns-mcp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/instance: dns-mcp
        app.kubernetes.io/name: dns-mcp
    spec:
      # Deliberately unbound — see service_account.yaml. The server reads as
      # the caller, so this account holds no permission of its own.
      #
      # This template carries no control plane configuration: which control
      # plane the server reads is deployment topology, so the deployer patches
      # in a kubeconfig volume and KUBECONFIG. Without one the binary refuses
      # to start rather than falling back to the local cluster's API server;
      # see checkControlPlaneEndpoint in cmd/dns-mcp.
      serviceAccountName: dns-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dns-mcp
          # The manager's image. It carries both binaries — they are released
          # together and share the condition vocabulary internal/agent's
          # catalog classifies — so `command` picks this one, exactly as the
          # manager's own Deployment names /manager.
          image: ghcr.io/datum-cloud/dns-operator:latest
          imagePullPolicy: Always
          command:
            - /dns-mcp
          args:
            - --addr=:8080
            - --tls-cert-file=/etc/dns-mcp/tls/tls.crt
            - --tls-key-file=/etc/dns-mcp/tls/tls.key
          # Still named http although it carries HTTPS: the Service and the
          # deployer's NetworkPolicies address this port by name and number.
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/dns-mcp/tls
              name: dns-mcp-certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      # No writable volume: the binary is static, the docs it serves are
      # compiled in, and nothing here writes to disk.
      #
      # The serving certificate names the Service as it is deployed: dns-mcp in
      # datum-dns-system, with no namePrefix. A deployer that renames either
      # must patch dns-names to match, or clients fail verification.
      volumes:
        - name: dns-mcp-certs
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: datum-control-plane
              csi.cert-manager.io/issuer-kind: ClusterIssuer
              csi.cert-manager.io/common-name: dns-mcp
              csi.cert-manager.io/dns-names: dns-mcp,dns-mcp.datum-dns-system.svc,dns-mcp.datum-dns-system.svc.cluster.local
              csi.cert-manager.io/key-usages: digital signature,key encipherment,server auth
              csi.cert-manager.io/fs-group: "65532"
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
