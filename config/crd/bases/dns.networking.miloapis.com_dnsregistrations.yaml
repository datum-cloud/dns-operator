---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
    discovery.miloapis.com/parent-contexts: Project
  name: dnsregistrations.dns.networking.miloapis.com
spec:
  group: dns.networking.miloapis.com
  names:
    kind: DNSRegistration
    listKind: DNSRegistrationList
    plural: dnsregistrations
    singular: dnsregistration
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              dnsZoneRef:
                description: |-
                  DNSNameReference selects a resource in the same project namespace.
                  DNS records its resolved lifetime in controller-owned status.
                properties:
                  name:
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
              name:
                description: Name is the owner name, relative to the zone or fully
                  qualified.
                maxLength: 253
                minLength: 1
                pattern: ^(@|[A-Za-z0-9*._-]+)$
                type: string
              recordTypes:
                items:
                  enum:
                  - A
                  - AAAA
                  - ALIAS
                  - CNAME
                  - TXT
                  - MX
                  - SRV
                  - CAA
                  - NS
                  - SOA
                  - PTR
                  - TLSA
                  - HTTPS
                  - SVCB
                  type: string
                maxItems: 14
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              reservedDescendants:
                items:
                  maxLength: 253
                  minLength: 1
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              ttlSeconds:
                description: TTLSeconds bounds cached dynamic answers to at most 30
                  seconds after withdrawal.
                format: int32
                maximum: 30
                minimum: 1
                type: integer
            required:
            - dnsZoneRef
            - name
            - recordTypes
            - ttlSeconds
            type: object
            x-kubernetes-validations:
            - message: dnsZoneRef requires a name
              rule: self.dnsZoneRef.name.size() > 0
            - message: dnsZoneRef is immutable
              rule: self.dnsZoneRef.name == oldSelf.dnsZoneRef.name
            - message: name is immutable
              rule: self.name == oldSelf.name
          status:
            properties:
              canonicalFQDN:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              publicationRevision:
                format: int64
                type: integer
              publicationWriterEpoch:
                description: |-
                  PublicationWriterEpoch and PublicationRevision name the publication when
                  one control plane publishes every region. With a control plane per
                  region they are left empty and Regions reports each region instead.
                format: int64
                type: integer
              regions:
                description: |-
                  Regions reports each serving region's publication when a control plane
                  runs in each region. Published is true once every region the zone is
                  served in has published this generation.
                items:
                  description: |-
                    DNSRegionPublicationStatus is one serving region's view of a private
                    publication, written by that region's control plane.
                  properties:
                    available:
                      description: |-
                        Available is true when the region's publication holds an eligible
                        endpoint for this registration.
                      type: boolean
                    observedGeneration:
                      description: ObservedGeneration is the object generation this
                        entry reports on.
                      format: int64
                      type: integer
                    programmed:
                      description: |-
                        Programmed is true once at least one of the region's serving replicas
                        applied the publication.
                      type: boolean
                    published:
                      description: |-
                        Published is true once the region's required serving replicas verified
                        the publication.
                      type: boolean
                    region:
                      minLength: 1
                      type: string
                    revision:
                      format: int64
                      type: integer
                    writerEpoch:
                      description: |-
                        WriterEpoch and Revision identify the region's publication. They are
                        ordered only within one region.
                      format: int64
                      type: integer
