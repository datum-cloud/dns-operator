apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: resource-metrics
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: resource-metrics
  # This is the UPSTREAM collector: discovery.mode=milo, so it engages every
  # project control plane and runs the dns-metrics policy there. The downstream
  # cluster gets its own single-mode deployment (see ../downstream).
  #
  # resource-metrics' published overlays/test-infra already provides the
  # token-based milo-kubeconfig Secret and the manager Deployment wiring. We
  # override the controller image (to the multi-arch tag) and replace the config
  # to point at our OTLP endpoint (our observability stack's collector lives in
  # telemetry-system, not the overlay's default otel-collector-system) and to
  # turn collectRootControlPlane back off — the overlay enables it, but the
  # shadow objects live on the downstream cluster, not on Milo's root scope, so
  # collecting root would add series without producing any downstream ones.
  path: overlays/test-infra
  images:
    - name: ghcr.io/milo-os/resource-metrics
      newTag: v0.0.0-feat-multi-arch-arm64-image
  patches:
    # Distinguish this deployment's pods from the downstream one's in the same
    # namespace. The bundle labels both identically, so without this the two
    # selectors overlap and any label lookup — `kubectl logs deploy/...`, a
    # Service, a PodMonitor — resolves to whichever pod it finds first. The
    # downstream side sets the matching `instance: downstream`.
    - target:
        kind: Deployment
        name: resource-metrics-controller-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: resource-metrics-controller-manager
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/instance: upstream
          template:
            metadata:
              labels:
                app.kubernetes.io/instance: upstream
    # Point the operator at our OTel collector. Once milo-os/resource-metrics#14
    # lands, replace this whole ConfigMap patch with a Deployment env patch:
    #   env: [{name: OTEL_EXPORTER_OTLP_ENDPOINT, value: otel-collector-collector.telemetry-system:4317}]
    - target:
        kind: ConfigMap
        name: resource-metrics-service-config
      patch: |
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: resource-metrics-service-config
        data:
          server.yaml: |
            apiVersion: apiserver.config.miloapis.com/v1alpha1
            kind: ResourceMetricsOperator
            discovery:
              mode: milo
              internalServiceDiscovery: false
              discoveryKubeconfigPath: /etc/milo/kubeconfig
              projectKubeconfigPath: /etc/milo/kubeconfig
              collectRootControlPlane: false
            otel:
              endpoint: otel-collector-collector.telemetry-system:4317
              insecure: true
              collectionInterval: 5s
              defaultMetricPrefix: ""
