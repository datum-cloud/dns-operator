# Kubeconfig the resource-metrics controller uses to reach the milo core
# control plane (the DOWNSTREAM / "root" CP) and to discover the project
# (UPSTREAM) control planes served by milo-apiserver. Modeled on
# milo-os/resource-metrics config/overlays/test-infra/milo-kubeconfig-secret.yaml.
#
# resource-metrics runs ON dns-control alongside milo-apiserver, so it uses the
# in-cluster Service endpoint directly (bypassing the Envoy gateway) — the pod
# serves a self-signed cert on :6443, so TLS verification is skipped.
#
# The token is the static `test-admin-token` wired into milo-apiserver's
# token-auth-file via secret milo-apiserver-auth-tokens (key tokens.csv) in
# namespace milo-system; it grants system:masters in the test environment.
#
# TEST-ONLY: production must use a least-privilege token or mTLS and source
# this Secret from a sealed/external secret store.
apiVersion: v1
kind: Secret
metadata:
  name: milo-kubeconfig
  namespace: resource-metrics-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: milo
      cluster:
        server: https://milo-apiserver.milo-system.svc.cluster.local:6443
        insecure-skip-tls-verify: true
    users:
    - name: milo-admin
      user:
        token: test-admin-token
    contexts:
    - name: milo
      context:
        cluster: milo
        user: milo-admin
    current-context: milo
