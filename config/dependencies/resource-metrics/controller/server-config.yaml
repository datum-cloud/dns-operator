# Operator configuration consumed by the resource-metrics manager via the
# --server-config flag. Substituted into the `resource-metrics-service-config`
# ConfigMap by configMapGenerator (keyed server.yaml) in kustomization.yaml.
#
# apiVersion/kind and field names come from the operator's internal/config
# package (ResourceMetricsOperator, DiscoveryConfig, OtelConfig).
apiVersion: apiserver.config.miloapis.com/v1alpha1
kind: ResourceMetricsOperator
discovery:
  # milo mode: discover project (upstream) control planes through the milo
  # multi-cluster provider, using the mounted milo kubeconfig for both the
  # discovery client and per-project client construction. Without these paths
  # the controller falls back to the in-cluster ServiceAccount (the kind
  # apiserver), which does not serve resourcemanager.miloapis.com — so Project
  # discovery would find nothing.
  mode: milo
  internalServiceDiscovery: false
  discoveryKubeconfigPath: /etc/milo/kubeconfig
  projectKubeconfigPath: /etc/milo/kubeconfig
  # CRITICAL for drift detection: also collect the milo core/root control plane
  # (the DOWNSTREAM, where the replicator writes the replicated copies) as
  # cluster name "root". The upstream project CPs supply
  # dns_recordset_upstream_info; the root CP supplies
  # dns_recordset_downstream_info. Recording rules diff the two.
  collectRootControlPlane: true
otel:
  # OTLP gRPC endpoint of the OTel collector deployed by test-infra's
  # `install-observability` task. That task applies an OpenTelemetryCollector
  # CR named `otel-collector` in namespace `telemetry-system`; the OTel
  # Operator renders a Service `<cr-name>-collector` (otel-collector-collector)
  # and the CR's receivers.otlp.protocols.grpc listens on :4317.
  # See README.md — confirm live if the collector name/namespace changes.
  endpoint: otel-collector-collector.telemetry-system.svc.cluster.local:4317
  insecure: true
  collectionInterval: 5s
  defaultMetricPrefix: ""
