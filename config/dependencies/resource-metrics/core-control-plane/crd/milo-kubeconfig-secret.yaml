# Kubeconfig Flux uses to install resource-metrics CRDs onto the Milo core
# control plane (a different API server than the local kind cluster). Flux
# resolves kubeConfig.secretRef in the Kustomization's namespace (flux-system)
# and reads the kubeconfig from the `value` key. In-cluster milo-apiserver +
# the test-only static test-admin-token — mirrors infra's milo-configuration-
# kubeconfig, which uses a cert-based kubeconfig in production.
apiVersion: v1
kind: Secret
metadata:
  name: resource-metrics-milo-kubeconfig
  namespace: flux-system
type: Opaque
stringData:
  value: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: milo
        cluster:
          server: https://milo-apiserver.milo-system.svc.cluster.local:6443
          insecure-skip-tls-verify: true
    users:
      - name: milo-admin
        user:
          token: test-admin-token
    contexts:
      - name: milo
        context:
          cluster: milo
          user: milo-admin
    current-context: milo
