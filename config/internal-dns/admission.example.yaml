apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: internal-dns-admission
  annotations:
    cert-manager.io/inject-ca-from: internal-dns-system/internal-dns-admission-tls
webhooks:
- name: validation.internal-dns.miloapis.com
  admissionReviewVersions: [v1]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  timeoutSeconds: 5
  clientConfig:
    service:
      namespace: internal-dns-system
      name: internal-dns-admission
      path: /validate-internal-dns
      port: 443
  rules:
  # Live DNS references require service validation.
  # The API server authorizes resource and status operations.
  - apiGroups: [dns.networking.miloapis.com]
    apiVersions: [v1alpha1]
    operations: [CREATE, UPDATE, DELETE]
    resources:
    - dnsrecordsets
    - dnszoneassociations
    - dnsregistrations
    - dnsrecordcontributions
    - dnsnamingpolicies
    - dnsresolveraccessbindings
    scope: Namespaced
# A managed zone, its owner references, and its managed label are kept while
# its resolver context exists. Only managed zones reach the webhook. The
# selector matches the old object too, and the handler refuses removing the
# label, so a zone can't drop out of the selector before it is deleted.
- name: managed-zones.internal-dns.miloapis.com
  admissionReviewVersions: [v1]
  sideEffects: None
  failurePolicy: Fail
  matchPolicy: Equivalent
  timeoutSeconds: 5
  objectSelector:
    matchLabels:
      dns.networking.miloapis.com/managed: "true"
  clientConfig:
    service:
      namespace: internal-dns-system
      name: internal-dns-admission
      path: /validate-internal-dns
      port: 443
  rules:
  - apiGroups: [dns.networking.miloapis.com]
    apiVersions: [v1alpha1]
    operations: [UPDATE, DELETE]
    resources:
    - dnszones
    scope: Namespaced
