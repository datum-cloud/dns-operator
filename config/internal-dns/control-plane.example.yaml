# reservedScopes is required: missing/null fails startup; [] explicitly disables
# reservations. Empty/missing publishers denies every publisher in that subtree.
# Nonempty reservations require admission.enabled. Usernames must match the
# authenticated project API caller; existing API authorization still applies.
# Migration: replace admission.instancePublishers with an explicit instances
# reservation and its publisher list. The legacy field is rejected, even empty.
# Audit existing objects first; publisher-list changes do not revoke stored
# contributions. Keep version-matched binary/config pairs during rollout.
# Switch the failure-closed internal-DNS webhook (including dnsrecordsets) to
# configured endpoints before removing the old record-set guard. Do not mix
# old/unconfigured endpoints. Roll reconciliation replicas to the same policy.
# Rollback to PR #338 alone cannot protect reservations other than instances.
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-dns-control-plane-config
  namespace: internal-dns-system
data:
  config.json: |
    {
      "region": "us-central1",
      "shard": "shared-0",
      "platformNamespace": "internal-dns-system",
      "platformKubeAPI": {"qps":50,"burst":100,"requestTimeoutSeconds":10},
      "projectDiscovery": {
        "kubeconfig": "/var/run/internal-dns/discovery/kubeconfig",
        "intervalSeconds": 10,
        "kubeAPI": {"qps":20,"burst":40,"requestTimeoutSeconds":10}
      },
      "nodeBackends": [
        {"memberID":"node-coredns-0","address":"fd70:10::10","port":5300}
      ],
      "clusterBackends": [
        {"memberID":"regional-coredns-us-central1-0","address":"fd70:20::10","port":5300},
        {"memberID":"regional-coredns-us-central1-1","address":"fd70:20::11","port":5300}
      ],
      "members": [
        {"memberID":"node-us-central1-0","replicaID":"node-us-central1-0","role":"node"},
        {"memberID":"regional-front-us-central1-0","replicaID":"regional-front-us-central1-0","role":"resolver"},
        {"memberID":"regional-coredns-us-central1-0","replicaID":"regional-coredns-us-central1-0","role":"regional"},
        {"memberID":"regional-coredns-us-central1-1","replicaID":"regional-coredns-us-central1-1","role":"regional"}
      ],
      "clusterPrefix": "fd70:200::/48",
      "privateZoneClassName": "private-coredns",
      "reservedScopes": [
        {"name":"instances","publishers":["<username compute writes project DNS objects as>"]},
        {"name":"databases","publishers":["<username database service writes project DNS objects as>"]}
      ],
      "managedDomainSuffixes": ["internal"],
      "ownershipLeaseSeconds": 30,
      "shards": [
        {"region":"us-central1","shard":"shared-0","maxBindings":200,"maxSnapshotBytes":524288}
      ],
      "nats": {
        "url": "tls://nats.internal-dns-system.svc:4222",
        "name": "internal-dns-control-plane",
        "username": "internal-dns-control-plane",
        "passwordFile": "/var/run/internal-dns/nats/password",
        "tls": {
          "caFile": "/var/run/internal-dns/nats/ca.crt",
          "certificateFile": "/var/run/internal-dns/nats/tls.crt",
          "keyFile": "/var/run/internal-dns/nats/tls.key",
          "serverName": "nats.internal-dns-system.svc"
        }
      },
      "stream": {
        "name": "DNS_PRIVATE",
        "subjects": ["dns.private.serving.>","dns.private.records.>","dns.private.acks.>"],
        "maxAge": 86400000000000,
        "maxBytes": 10737418240,
        "replicas": 3,
        "snapshotsBucket": "DNS_PRIVATE_SNAPSHOTS"
      },
      "ensureStream": true,
      "admission": {
        "enabled": true,
        "port": 9443,
        "certDir": "/var/run/internal-dns/admission"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-dns-control-plane
  namespace: internal-dns-system
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: internal-dns-control-plane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: internal-dns-control-plane}
    spec:
      serviceAccountName: internal-dns-control-plane
      containers:
      - name: control-plane
        image: example.invalid/dns-operator/internal-dns:VERSION
        args: ["--role=control-plane","--config=/etc/internal-dns/config.json","--kubeconfig=/var/run/internal-dns/platform/kubeconfig"]
        ports:
        - {name: admission, containerPort: 9443}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 2Gi}
        readinessProbe:
          httpGet: {scheme: HTTPS, path: /readyz, port: admission}
          periodSeconds: 5
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: discovery, mountPath: /var/run/internal-dns/discovery, readOnly: true}
        - {name: platform, mountPath: /var/run/internal-dns/platform, readOnly: true}
        - {name: config, mountPath: /etc/internal-dns, readOnly: true}
        - {name: nats, mountPath: /var/run/internal-dns/nats, readOnly: true}
        - {name: admission, mountPath: /var/run/internal-dns/admission, readOnly: true}
      volumes:
      - name: discovery
        secret:
          secretName: internal-dns-discovery-kubeconfig
          items: [{key: value, path: kubeconfig}]
      - name: platform
        secret:
          secretName: internal-dns-service-kubeconfig
          items: [{key: value, path: kubeconfig}]
      - name: config
        configMap: {name: internal-dns-control-plane-config}
      - name: nats
        secret: {secretName: internal-dns-control-plane-nats}
      - name: admission
        secret: {secretName: internal-dns-admission-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: internal-dns-admission
  namespace: internal-dns-system
spec:
  selector: {app.kubernetes.io/name: internal-dns-control-plane}
  ports:
  - {name: https, port: 443, targetPort: admission}
