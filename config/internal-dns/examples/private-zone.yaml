apiVersion: dns.networking.miloapis.com/v1alpha1
kind: DNSZone
metadata:
  name: production
  namespace: project
spec:
  visibility: Private
  domainName: prod.internal
---
apiVersion: dns.networking.miloapis.com/v1alpha1
kind: DNSZoneAssociation
metadata:
  name: application-production
  namespace: project
spec:
  # Select resources by name within this project namespace.
  dnsZoneRef:
    name: production
  resolverContextRef:
    name: application-network
