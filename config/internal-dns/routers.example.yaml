---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-dns-node-0
  namespace: internal-dns-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-dns-node-0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-dns-node-0
        internal-dns.datum.net/tier: node
    spec:
      serviceAccountName: internal-dns-fleet
      automountServiceAccountToken: false
      shareProcessNamespace: true
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: agent
        image: example.invalid/dns-operator/internal-dns-serving:VERSION
        args:
        - "--role=agent"
        - "--config=/config/config.json"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
            add:
            - KILL
        volumeMounts:
        - name: config
          mountPath: "/config"
          readOnly: true
        - name: nats
          mountPath: "/var/run/internal-dns/nats"
          readOnly: true
        - name: activation
          mountPath: "/run/internal-dns"
        - name: state
          mountPath: "/var/lib/internal-dns"
        - name: daemon-config
          mountPath: "/etc/internal-dns"
      - name: serving
        image: example.invalid/dns-operator/internal-dns-serving:VERSION
        command:
        - "/internal-dns"
        args:
        - "--role=serving"
        - "--config=/config/config.json"
        readinessProbe:
          exec:
            command:
            - "/internal-dns"
            - "--role=readiness"
            - "--config=/config/config.json"
          periodSeconds: 2
          timeoutSeconds: 2
        securityContext: &1
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 65533
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        volumeMounts:
        - name: config
          mountPath: "/config"
          readOnly: true
        - name: state
          mountPath: "/var/lib/internal-dns"
        - name: activation
          mountPath: "/run/internal-dns"
        - name: daemon-config
          mountPath: "/etc/internal-dns"
        - name: runtime
          mountPath: "/tmp"
      - name: dnsdist
        image: powerdns/dnsdist-20:2.0.10@sha256:24ac720af997aff6b98cb5b50d748754f815428e07b5368dfb0eccd5aa8d07e8
        command:
        - "/usr/local/bin/dnsdist"
        args:
        - "--supervised"
        - "--disable-syslog"
        - "-C"
        - "/etc/internal-dns/node-dnsdist.conf"
        securityContext: *1
        volumeMounts:
        - name: daemon-config
          mountPath: "/etc/internal-dns"
          readOnly: true
        - name: activation
          mountPath: "/run/internal-dns"
          readOnly: true
        - name: runtime
          mountPath: "/tmp"
      volumes:
      - name: config
        configMap:
          name: internal-dns-node-0-config
      - name: nats
        secret:
          secretName: internal-dns-node-0-nats
      - name: activation
        emptyDir:
          medium: Memory
      - name: runtime
        emptyDir: {}
      - name: daemon-config
        persistentVolumeClaim:
          claimName: internal-dns-node-0-config
      - name: state
        persistentVolumeClaim:
          claimName: internal-dns-node-0-state
      initContainers:
      - name: dnsdist-config
        image: example.invalid/dns-operator/internal-dns-serving:VERSION
        args:
        - "--role=prepare"
        - "--config=/config/config.json"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: "/config"
          readOnly: true
        - name: nats
          mountPath: "/var/run/internal-dns/nats"
          readOnly: true
        - name: activation
          mountPath: "/run/internal-dns"
        - name: state
          mountPath: "/var/lib/internal-dns"
        - name: daemon-config
          mountPath: "/etc/internal-dns"
