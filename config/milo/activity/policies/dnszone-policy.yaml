# ActivityPolicy for DNSZone resources.
# Defines how DNSZone API operations and controller events appear in activity timelines.
#
# Audit rules handle CRUD operations captured by the Kubernetes API server audit log.
# Event rules handle async controller events for programming outcomes.
#
# Design principles:
# - Use domain names (example.com) as display text, not resource names (example-com)
# - Action-oriented language ("created zone", not "created DNS zone")
# - Show relevant DNS data (nameservers) where available
# - Graceful fallback when audit.responseObject.spec is unavailable
#
# IMPORTANT: For DELETE operations, audit.requestObject is a DeleteOptions (not the resource),
# so we use the response domain when available, otherwise a generic deletion summary.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  labels:
    meta.datumapis.com/service: dns
    meta.datumapis.com/team: delivery
  name: dns.networking.miloapis.com-dnszone
spec:
  resource:
    apiGroup: dns.networking.miloapis.com
    kind: DNSZone

  # Audit log rules for CRUD operations.
  # These are automatically captured by the API server and don't require controller code.
  # All rules exclude system components (!audit.user.username.startsWith('system:'))
  # so controller reconciliation doesn't generate activity noise.
  # Only successful API responses generate successful CRUD summaries.
  auditRules:
    # Zone creation with a usable domain name as display text in the link
    - name: create
      match: >-
        !(has(audit.requestURI) && audit.requestURI.contains('dryRun=')) &&
        has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !audit.user.username.startsWith('system:') && audit.verb == 'create' &&
        has(audit.requestObject) && type(audit.requestObject) == map &&
        has(audit.requestObject.spec) && type(audit.requestObject.spec) == map &&
        has(audit.requestObject.spec.domainName) &&
        type(audit.requestObject.spec.domainName) == string && audit.requestObject.spec.domainName != ''
      summary: "{{ actor }} created zone {{ link(audit.requestObject.spec.domainName, audit.objectRef) }}"

    # Zone creation fallback (domain name unavailable)
    - name: create-fallback
      match: "has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !audit.user.username.startsWith('system:') && audit.verb == 'create' && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} created {{ link('a DNS zone', audit.objectRef) }}"

    # Zone deletion with audit.responseObject.spec available (response contains the deleted resource)
    - name: delete
      match: >-
        !(has(audit.requestURI) && audit.requestURI.contains('dryRun=')) &&
        has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !audit.user.username.startsWith('system:') && audit.verb == 'delete' &&
        has(audit.responseObject) && type(audit.responseObject) == map &&
        has(audit.responseObject.spec) && type(audit.responseObject.spec) == map &&
        has(audit.responseObject.spec.domainName) &&
        type(audit.responseObject.spec.domainName) == string && audit.responseObject.spec.domainName != ''
      summary: "{{ actor }} deleted zone {{ audit.responseObject.spec.domainName }}"

    # Zone deletion fallback (domain name unavailable on response)
    - name: delete-fallback
      match: "has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !audit.user.username.startsWith('system:') && audit.verb == 'delete' && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted a DNS zone"

    # Spec changes use domain display text. JSON Patch arrays require inspecting
    # operation paths; other updates retain the generic fallback below.
    - name: update
      match: >-
        !(has(audit.requestURI) && audit.requestURI.contains('dryRun=')) &&
        has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 &&
        !audit.user.username.startsWith('system:') &&
        audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) &&
        has(audit.requestObject) && (
          (type(audit.requestObject) == map && has(audit.requestObject.spec)) ||
          (type(audit.requestObject) == list && audit.requestObject.exists(op,
            type(op) == map && has(op.op) && type(op.op) == string &&
            op.op in ['add', 'remove', 'replace', 'move', 'copy'] &&
            has(op.path) && type(op.path) == string && (
              op.path == '' || op.path == '/spec' || op.path.startsWith('/spec/') ||
              (op.op == 'move' && has(op.from) && type(op.from) == string &&
                (op.from == '/spec' || op.from.startsWith('/spec/')))
            )
          ))
        )
      # Partial updates may omit domainName or explicitly set it to null. Prefer
      # the resulting resource, then the request, then the stable resource name.
      summary: "{{ actor }} updated zone {{ link( has(audit.responseObject) && type(audit.responseObject) == map && has(audit.responseObject.spec) && type(audit.responseObject.spec) == map && has(audit.responseObject.spec.domainName) && type(audit.responseObject.spec.domainName) == string && audit.responseObject.spec.domainName != '' ? audit.responseObject.spec.domainName : has(audit.requestObject) && type(audit.requestObject) == map && has(audit.requestObject.spec) && type(audit.requestObject.spec) == map && has(audit.requestObject.spec.domainName) && type(audit.requestObject.spec.domainName) == string && audit.requestObject.spec.domainName != '' ? audit.requestObject.spec.domainName : audit.objectRef.name, audit.objectRef) }}"

    # Preserve generic activity for other user updates, including metadata-only
    # patches and audit records whose request body is unavailable.
    - name: update-fallback
      match: "has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && !has(audit.objectRef.subresource) && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated {{ link('a DNS zone', audit.objectRef) }}"

  # Event rules for controller-emitted Kubernetes events.
  # These capture async outcomes that audit logs cannot represent.
  # Uses conversational tone for system-initiated events.
  eventRules:
    # ZoneProgrammed: DNS zone successfully programmed to the DNS provider.
    # Annotations available:
    #   dns.networking.miloapis.com/event-type: dns.zone.programmed
    #   dns.networking.miloapis.com/domain-name: example.com
    #   dns.networking.miloapis.com/zone-class: production
    #   dns.networking.miloapis.com/nameservers: ns1.example.com,ns2.example.com
    #   dns.networking.miloapis.com/resource-name: my-zone
    #   dns.networking.miloapis.com/resource-namespace: my-project
    - name: zone-programmed
      match: "event.reason == 'ZoneProgrammed'"
      summary: "Your zone is ready! {{ link(event.metadata.annotations['dns.networking.miloapis.com/domain-name'], event.regarding) }} is live with nameservers {{ event.metadata.annotations['dns.networking.miloapis.com/nameservers'] }}"

    # ZoneProgrammingFailed: DNS zone programming failed after previous success.
    # Annotations available:
    #   dns.networking.miloapis.com/event-type: dns.zone.programming_failed
    #   dns.networking.miloapis.com/domain-name: example.com
    #   dns.networking.miloapis.com/failure-reason: Provider API error
    #   dns.networking.miloapis.com/resource-name: my-zone
    #   dns.networking.miloapis.com/resource-namespace: my-project
    - name: zone-programming-failed
      match: "event.reason == 'ZoneProgrammingFailed'"
      summary: "We hit a snag configuring {{ link(event.metadata.annotations['dns.networking.miloapis.com/domain-name'], event.regarding) }}, but we'll keep retrying automatically — no action needed on your end."
