# Recording + alerting rules that diff the dns-metrics series (dns-metrics-policy.yaml)
# to detect drift between upstream (project) and downstream (root) control planes.
# See docs/enhancements/controlplane-drift-detection.md.
#
# The policy runs on every control plane, so both generators emit everywhere.
# The rules partition on milo_control_plane_type ("root" vs "project") to keep
# each side's stray series out of the diff, and normalize both sides to a bare
# `proj` label to join on (proj, upstream_namespace, upstream_name).
#
# This is a standard PrometheusRule: victoria-metrics-operator converts it to a
# VMRule and preserves labels, so the resource-metrics-aggregator label below
# routes it to the vmalert that has the resource-metrics datasource.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dns-controlplane-drift
  labels:
    managed-by: flux
    app.kubernetes.io/part-of: dns-operator
    # Selector for the resource-metrics aggregator vmalert; presence is what
    # matters, not the value.
    telemetry.miloapis.com/resource-metrics-aggregator: "true"
spec:
  groups:
    - name: dns.drift.recording
      interval: 30s
      rules:
        # Upstream project CPs, milo_project_name copied to the bare `proj` join
        # key. Downstream's cluster label is normalized to match below: the
        # annotation is "cluster-_<project>" (the replicator maps the milo key
        # "/alpha" to "_alpha"), verified live against milo_project_name="alpha".
        - record: dns:recordset_upstream:normalized
          expr: |
            label_replace(
              dns_recordset_upstream_info{milo_control_plane_type="project"},
              "proj", "$1", "milo_project_name", "(.*)"
            )

        # Downstream root CP records, cluster label stripped of "cluster-_" to
        # recover the bare `proj`.
        - record: dns:recordset_downstream:scoped
          expr: |
            label_replace(
              dns_recordset_downstream_info{milo_control_plane_type="root"},
              "proj", "$1", "upstream_cluster", "cluster-_?(.*)"
            )

        # Orphan: a downstream record with no upstream owner — the engineering#346
        # leftover that keeps "reserving" a name after its owner is deleted.
        - record: dns:recordset_downstream_orphan
          expr: |
            dns:recordset_downstream:scoped
              unless on(proj, upstream_namespace, upstream_name)
            dns:recordset_upstream:normalized

        # Missing: an upstream record with no downstream copy — replication stalled.
        - record: dns:recordset_downstream_missing
          expr: |
            dns:recordset_upstream:normalized
              unless on(proj, upstream_namespace, upstream_name)
            dns:recordset_downstream:scoped

    - name: dns.drift.alerts
      rules:
        - alert: DNSDownstreamOrphanRecordSet
          # for: rides out normal replication/staleness lag, so only persistent
          # drift pages.
          expr: dns:recordset_downstream_orphan > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Orphaned downstream DNSRecordSet (no upstream owner)"
            description: >-
              DNSRecordSet {{ $labels.upstream_name }} in namespace
              {{ $labels.upstream_namespace }} (cluster {{ $labels.upstream_cluster }})
              exists on the downstream control plane with no matching upstream
              owner. This is the failure mode from engineering#346 and can block
              new records for the same name. Runbook: docs/enhancements/controlplane-drift-detection.md

        - alert: DNSDownstreamMissingRecordSet
          expr: dns:recordset_downstream_missing > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Upstream DNSRecordSet not replicated downstream"
            description: >-
              DNSRecordSet {{ $labels.upstream_name }} in namespace
              {{ $labels.upstream_namespace }} (cluster {{ $labels.upstream_cluster }})
              exists upstream but has no downstream copy — replication may be
              stalled or a replica may not own this cluster.

        - alert: DNSRecordSetNotAccepted
          expr: dns_recordset_upstream_info{accepted="false", milo_control_plane_type="project"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "DNSRecordSet stuck not-Accepted for 15m"
            description: >-
              DNSRecordSet {{ $labels.upstream_name }} in namespace
              {{ $labels.upstream_namespace }} has not reached Accepted=True.
