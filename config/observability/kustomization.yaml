# Observability configuration for detecting upstream/downstream control-plane
# drift in the DNS service.
#
#   dns-metrics-policy.yaml   ResourceMetricsPolicy (milo-os/resource-metrics)
#   dns-drift-rules.yaml      recording + alerting rules (PrometheusRule)
#
# These are platform/infra objects. Per datum-cloud/infra conventions:
#   - The ResourceMetricsPolicy is applied to the Milo core control plane (where
#     the resource-metrics CRDs are installed via milo-configuration-kubeconfig),
#     NOT a plain cluster. resource-metrics must run with
#     discovery.collectRootControlPlane: true (NOT yet enabled in infra) for the
#     downstream/core-CP series this depends on.
#   - The PrometheusRule (auto-converted to VMRule by victoria-metrics-operator)
#     is picked up by the resource-metrics aggregator vmalert via its label.
# Kept in this repo co-located with the operator they observe; deployment wiring
# lives in the infra repo (or the e2e overlay).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dns-metrics-policy.yaml
  - dns-drift-rules.yaml
