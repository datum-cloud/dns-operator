apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dns-agent-system

resources:
  - ../../agent

components:
  - ../../agent/components/namespace

patches:
  - target:
      kind: StatefulSet
      name: pdns-auth
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --controller-class=powerdns-e2e
