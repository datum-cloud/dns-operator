# Shared CRDs are installed once before the parallel CI lanes start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../agent-powerdns-federated
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: shared-crd
