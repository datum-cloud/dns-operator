# Retarget the PowerDNS agent's read/write source at the Milo core control plane.
#
# For --role=downstream (cmd/main.go), the manager and all controllers are built
# from ctrl.GetConfigOrDie() + mgr.GetClient(); the server-config discovery/
# downstream kubeconfig fields are NOT consulted in that branch. controller-
# runtime's ctrl.GetConfig() honors the KUBECONFIG env var before falling back to
# in-cluster config (no --kubeconfig flag is registered), so pointing KUBECONFIG
# at the mounted milo kubeconfig makes both the DNSRecordSet/DNSZone reads and the
# status writes resolve to the Milo core CP instead of the local kind API.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pdns-auth
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            - name: KUBECONFIG
              value: /milo/kubeconfig
          volumeMounts:
            - name: milo-kubeconfig
              mountPath: /milo
              readOnly: true
      volumes:
        - name: milo-kubeconfig
          secret:
            secretName: milo-kubeconfig
