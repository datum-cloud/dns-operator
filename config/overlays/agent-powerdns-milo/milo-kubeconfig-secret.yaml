# Kubeconfig the PowerDNS agent uses to talk to the Milo *core* control plane
# (milo-apiserver root scope), where the DNS CRDs and DNSRecordSets live in this
# drift-detection e2e. The base agent config defaults to the in-cluster
# ServiceAccount kubeconfig (the local kind apiserver), which does not host the
# DNSRecordSets the agent must program into PowerDNS — so without this Secret the
# agent reads an empty/wrong API.
#
# - server: in-cluster Service for milo-apiserver. The pod listens on port 6443
#   with a self-signed cert, so we skip TLS verification. This targets the
#   milo-apiserver ROOT endpoint directly (no aggregation path), which serves
#   dns.networking.miloapis.com/v1alpha1 DNSRecordSet/DNSZone/DNSZoneClass.
# - token: the static `test-admin-token` wired into milo's test-infra overlay
#   (token-auth-file, secret milo-apiserver-auth-tokens key tokens.csv, ns
#   milo-system). It grants system:masters in the test environment.
#
# Test-overlay-only construct; production deployments should use a least-privilege
# token (or mTLS) sourced from a sealed-secret / external secret store.
apiVersion: v1
kind: Secret
metadata:
  name: milo-kubeconfig
  namespace: dns-agent-system
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: milo
      cluster:
        server: https://milo-apiserver.milo-system.svc.cluster.local:6443
        insecure-skip-tls-verify: true
    users:
    - name: milo-admin
      user:
        token: test-admin-token
    contexts:
    - name: milo
      context:
        cluster: milo
        user: milo-admin
    current-context: milo
