apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: network-services-operator-system

resources:
  # NSO's own deployment, from the clone that `task nso-clone` makes (NSO_DIR)
  - ../../../dev/network-services-operator/config/default
  - leader-election-rbac.yaml
  - domain-rbac.yaml
  - configmap-rbac.yaml
  - secret-rbac.yaml

# Replace NSO's config in the same build, so that the manager mounts this one under the name
# NSO's bundle gives it, hashed or not, and restarts when it changes.
configMapGenerator:
  - name: config
    behavior: replace
    files:
      - config.yaml
      # Use the upstream kubeconfig for downstreamResourceManagement.kubeconfigPath
      - kubeconfig=../../../dev/kind.upstream.kubeconfig
