# Shared CRDs are installed once before the parallel CI lanes start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../replicator
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      $patch: delete
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: shared-crd
  # Private qualification has its own admission service. Do not let public
  # webhook startup block it while the two deployment lanes overlap.
  - target:
      kind: MutatingWebhookConfiguration
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: mutating-webhook-configuration
      webhooks:
        - name: mdnsrecordset.kb.io
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values: [project-e2e]
  - target:
      kind: ValidatingWebhookConfiguration
    patch: |-
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: validating-webhook-configuration
      webhooks:
        - name: vdnsrecordset.kb.io
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values: [project-e2e]
        - name: vinternaldns.kb.io
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values: [project-e2e]
