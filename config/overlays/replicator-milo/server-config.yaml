apiVersion: dns.networking.miloapis.com/v1alpha1
kind: DNSOperator
# Production-accurate Milo topology for the drift-detection e2e.
#
# The replicator discovers project (upstream) control planes through
# milo-apiserver, and writes the replicated shadow objects to a SEPARATE
# downstream cluster — not to Milo's core control plane. That split is what
# production does: project CPs are served by milo, while the shadow objects live
# in the DNS infrastructure cluster's own apiserver, alongside the agent that
# programs PowerDNS from them.
#
#   discovery:  lists ProjectControlPlane objects on milo-apiserver
#   project:    template rest-config the provider rewrites to per-project
#               aggregation paths on the same milo-apiserver
#   downstream: the downstream cluster's apiserver, mounted separately
discovery:
  mode: milo
  internalServiceDiscovery: false
  discoveryKubeconfigPath: "/milo/kubeconfig"
  projectKubeconfigPath: "/milo/kubeconfig"
downstreamResourceManagement:
  kubeconfigPath: "/downstream/kubeconfig"

controllers:
  dnsRecordSetPowerDNS:
    # maxConcurrentReconciles: 4
    # rateLimiterBaseDelay: 1s
    # rateLimiterMaxDelay: 30s

# usage:
# Inventory gauges require leader election. This overlay runs 2 replicas with
# LEADER_ELECT=false, so the manager refuses to register InventoryReporter
# even if usage.enabled is set. Do not enable usage here.
#   enabled: true
#   endpoint: http://localhost:9880/cloudevents
#   location: us-east-1
#   flushInterval: 60s
