<svg xmlns="http://www.w3.org/2000/svg" width="960" height="755" viewBox="0 0 960 755" role="img" aria-labelledby="title description">
  <title id="title">Overlapping addresses, separate DNS contexts</title>
  <desc id="description">Two VPCs use client 10.0.0.5 and resolver fd53::53. Galactic authorizes each private path and translates it to a distinct service destination. The shared DNS fleet maps the destinations to separate contexts before lookup. The same private name returns different addresses.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="755" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">Overlapping addresses, separate DNS contexts</text>
  <rect x="55" y="115" width="380" height="165" rx="9" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="71" y="142" class="heading" text-anchor="start">Consumer VPC A</text>
  <rect x="80" y="155" width="145" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="152.5" y="186.0" class="label" text-anchor="middle">Client</text>
  <text x="152.5" y="210.0" class="label" text-anchor="middle">10.0.0.5</text>
  <rect x="270" y="155" width="140" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="340.0" y="186.0" class="label" text-anchor="middle">DNS endpoint</text>
  <text x="340.0" y="210.0" class="label" text-anchor="middle">fd53::53</text>
  <path d="M 225 192 H 270" class="edge"/>
  <rect x="115" y="320" width="260" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="245.0" y="351.0" class="label" text-anchor="middle">Galactic private path A</text>
  <text x="245.0" y="375.0" class="label" text-anchor="middle">Authorize and translate</text>
  <path d="M 340 229 V 300 H 245 V 320" class="edge"/>
  <rect x="530" y="115" width="380" height="165" rx="9" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="546" y="142" class="heading" text-anchor="start">Consumer VPC B</text>
  <rect x="555" y="155" width="145" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="627.5" y="186.0" class="label" text-anchor="middle">Client</text>
  <text x="627.5" y="210.0" class="label" text-anchor="middle">10.0.0.5</text>
  <rect x="745" y="155" width="140" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="815.0" y="186.0" class="label" text-anchor="middle">DNS endpoint</text>
  <text x="815.0" y="210.0" class="label" text-anchor="middle">fd53::53</text>
  <path d="M 700 192 H 745" class="edge"/>
  <rect x="590" y="320" width="260" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="720.0" y="351.0" class="label" text-anchor="middle">Galactic private path B</text>
  <text x="720.0" y="375.0" class="label" text-anchor="middle">Authorize and translate</text>
  <path d="M 815 229 V 300 H 720 V 320" class="edge"/>
  <rect x="55" y="435" width="855" height="250" rx="9" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="480" y="462" class="heading" text-anchor="middle">Shared DNS service fleet</text>
  <rect x="112.5" y="480" width="265" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="245.0" y="511.0" class="label" text-anchor="middle">Service destination</text>
  <text x="245.0" y="535.0" class="label" text-anchor="middle">fd70:100::10</text>
  <path d="M 245.0 394 V 480" class="edge"/>
  <rect x="112.5" y="590" width="265" height="74" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="245.0" y="621.0" class="label" text-anchor="middle">DNS context A</text>
  <text x="245.0" y="645.0" class="label" text-anchor="middle">api.prod.internal = 10.20.0.10</text>
  <path d="M 245.0 554 V 590" class="edge"/>
  <rect x="587.5" y="480" width="265" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="720.0" y="511.0" class="label" text-anchor="middle">Service destination</text>
  <text x="720.0" y="535.0" class="label" text-anchor="middle">fd70:100::11</text>
  <path d="M 720.0 394 V 480" class="edge"/>
  <rect x="587.5" y="590" width="265" height="74" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="720.0" y="621.0" class="label" text-anchor="middle">DNS context B</text>
  <text x="720.0" y="645.0" class="label" text-anchor="middle">api.prod.internal = 10.20.0.20</text>
  <path d="M 720.0 554 V 590" class="edge"/>
  <text x="32" y="710" class="detail" text-anchor="start">DNS selects the authorized context before looking up records or cached answers.</text>
</svg>
