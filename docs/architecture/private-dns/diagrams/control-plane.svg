<svg xmlns="http://www.w3.org/2000/svg" width="960" height="840" viewBox="0 0 960 840" role="img" aria-labelledby="title description">
  <title id="title">Control-plane boundaries</title>
  <desc id="description">Two views of the same components. Controllers read consumer project intent, maintain service project resources, and commit snapshots and outboxes. Exporters deliver updates through regional NATS to the serving fleet. Member acknowledgments return through NATS to the status handler, which writes publication observations, binding observations, and consumer serving status.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="840" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">Control-plane boundaries</text>
  <text x="48" y="120" class="eyebrow" text-anchor="start">COMPILE AND DELIVER</text>
  <text x="520" y="120" class="eyebrow" text-anchor="start">ACKNOWLEDGE AND REPORT</text>
  <rect x="48" y="145" width="250" height="50" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="173.0" y="176.0" class="label" text-anchor="middle">Consumer project API</text>
  <rect x="48" y="245" width="250" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="173.0" y="276.0" class="label" text-anchor="middle">DNS controllers</text>
  <rect x="48" y="345" width="250" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="173.0" y="376.0" class="label" text-anchor="middle">Publication store</text>
  <rect x="48" y="445" width="250" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="173.0" y="476.0" class="label" text-anchor="middle">Regional exporter</text>
  <rect x="48" y="545" width="250" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="173.0" y="576.0" class="label" text-anchor="middle">Regional NATS</text>
  <rect x="48" y="645" width="250" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="173.0" y="676.0" class="label" text-anchor="middle">Shared serving fleet</text>
  <path d="M 173 195 V 245" class="edge"/>
  <text x="195" y="225" class="message" text-anchor="start">Project inputs</text>
  <path d="M 173 295 V 345" class="edge"/>
  <text x="195" y="325" class="message" text-anchor="start">Commit snapshots and outboxes</text>
  <path d="M 173 395 V 445" class="edge"/>
  <text x="195" y="425" class="message" text-anchor="start">Committed updates</text>
  <path d="M 173 495 V 545" class="edge"/>
  <text x="195" y="525" class="message" text-anchor="start">Export</text>
  <path d="M 173 595 V 645" class="edge"/>
  <text x="195" y="625" class="message" text-anchor="start">Updates</text>
  <rect x="520" y="145" width="270" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="655.0" y="176.0" class="label" text-anchor="middle">Shared serving fleet</text>
  <rect x="520" y="245" width="270" height="50" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="655.0" y="276.0" class="label" text-anchor="middle">Regional NATS</text>
  <rect x="520" y="345" width="270" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="655.0" y="376.0" class="label" text-anchor="middle">Acknowledgment handler</text>
  <text x="655.0" y="400.0" class="label" text-anchor="middle">and status refresh</text>
  <path d="M 655 195 V 245" class="edge"/>
  <text x="680" y="214" class="message" text-anchor="start">Member</text>
  <text x="680" y="238" class="message" text-anchor="start">acknowledgments</text>
  <path d="M 655 295 V 345" class="edge"/>
  <text x="680" y="325" class="message" text-anchor="start">Acknowledgments</text>
  <rect x="590" y="480" width="290" height="50" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="735.0" y="511.0" class="label" text-anchor="middle">Publication store</text>
  <path d="M 550 419 V 505 H 590" class="edge"/>
  <text x="610" y="470" class="message" text-anchor="start">Publication observations</text>
  <rect x="590" y="580" width="290" height="50" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="735.0" y="611.0" class="label" text-anchor="middle">DNS service project API</text>
  <path d="M 550 419 V 605 H 590" class="edge"/>
  <text x="610" y="570" class="message" text-anchor="start">Binding observations</text>
  <rect x="590" y="680" width="290" height="50" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="735.0" y="711.0" class="label" text-anchor="middle">Consumer project API</text>
  <path d="M 550 419 V 705 H 590" class="edge"/>
  <text x="610" y="670" class="message" text-anchor="start">Serving status</text>
  <text x="32" y="770" class="detail" text-anchor="start">Controllers maintain references, resolver bindings, and address claims in the service API.</text>
  <text x="32" y="794" class="detail" text-anchor="start">The store uses the Kubernetes API or JetStream KV. Repeated boxes refer to the same components.</text>
</svg>
