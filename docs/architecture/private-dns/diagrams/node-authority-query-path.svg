<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Opt-in: private answers on the node</title>
  <desc id="description">Regional NATS delivers committed snapshots and publications to the node agent. The agent validates and activates local CoreDNS state. Queries flow from the VPC client through Galactic and node dnsdist to node CoreDNS. Private names use the applied local snapshot; public names use a per-context cache and the configured public recursor. Private queries bypass regional query serving, while regional publication ownership and delivery remain unchanged. Dashed arrows carry updates; solid arrows carry queries.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="720" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">Opt-in: private answers on the node</text>
  <rect x="395" y="110" width="533" height="475" rx="9" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="411" y="137" class="heading" text-anchor="start">Authoritative node</text>
  <rect x="45" y="160" width="250" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="170.0" y="191.0" class="label" text-anchor="middle">Regional NATS</text>
  <text x="170.0" y="215.0" class="label" text-anchor="middle">Committed publications</text>
  <rect x="700" y="160" width="210" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="805.0" y="191.0" class="label" text-anchor="middle">Node agent</text>
  <text x="805.0" y="215.0" class="label" text-anchor="middle">Validate and activate</text>
  <path d="M 295 197 H 700" class="edge return"/>
  <text x="480" y="184" class="message" text-anchor="middle">Committed updates</text>
  <rect x="45" y="330" width="140" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="115.0" y="373.0" class="label" text-anchor="middle">VPC client</text>
  <rect x="235" y="330" width="130" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="300.0" y="361.0" class="label" text-anchor="middle">Galactic</text>
  <text x="300.0" y="385.0" class="label" text-anchor="middle">private path</text>
  <rect x="420" y="330" width="150" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="495.0" y="373.0" class="label" text-anchor="middle">Node dnsdist</text>
  <rect x="700" y="330" width="210" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="805.0" y="373.0" class="label" text-anchor="middle">Node CoreDNS</text>
  <path d="M 185 367 H 235" class="edge"/>
  <path d="M 365 367 H 420" class="edge"/>
  <path d="M 570 367 H 700" class="edge"/>
  <text x="392" y="315" class="message" text-anchor="middle">UDP or TCP</text>
  <text x="635" y="315" class="message" text-anchor="middle">TCP or keyed UDP</text>
  <path d="M 805 234 V 330" class="edge return"/>
  <text x="785" y="278" class="message" text-anchor="end">Install verified state</text>
  <rect x="420" y="480" width="230" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="535.0" y="511.0" class="label" text-anchor="middle">Applied private-zone</text>
  <text x="535.0" y="535.0" class="label" text-anchor="middle">snapshot</text>
  <rect x="700" y="480" width="210" height="74" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="805.0" y="511.0" class="label" text-anchor="middle">Per-context</text>
  <text x="805.0" y="535.0" class="label" text-anchor="middle">public cache</text>
  <path d="M 805 404 V 440 H 535 V 480" class="edge"/>
  <path d="M 805 440 V 480" class="edge"/>
  <text x="535" y="464" class="message" text-anchor="middle">Private name</text>
  <text x="805" y="464" class="message" text-anchor="middle">Public name</text>
  <rect x="700" y="620" width="210" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="805.0" y="651.0" class="label" text-anchor="middle">Public recursor</text>
  <text x="805.0" y="675.0" class="label" text-anchor="middle">Configured upstream</text>
  <path d="M 805 554 V 620" class="edge"/>
  <text x="32" y="625" class="detail" text-anchor="start">Private queries stay on the node. Regional publication still applies.</text>
  <text x="32" y="649" class="detail" text-anchor="start">Keep regional query serving during migration and rollback.</text>
  <text x="32" y="673" class="detail" text-anchor="start">Dashed arrows carry updates; solid arrows carry queries.</text>
</svg>
