<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">How workloads use Private DNS</title>
  <desc id="description">Compute instances and services publish private names and addresses to Private DNS. Additional private zones can be associated with a VPC. Applications in that VPC send queries and receive answers through a stable resolver. Private DNS resolves public names through public DNS. Each VPC resolves private names only from its associated zones.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="560" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">How workloads use Private DNS</text>
  <rect x="40" y="130" width="240" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="160.0" y="161.0" class="label" text-anchor="middle">Compute instances</text>
  <text x="160.0" y="185.0" class="label" text-anchor="middle">and services</text>
  <rect x="40" y="280" width="240" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="160.0" y="311.0" class="label" text-anchor="middle">Additional</text>
  <text x="160.0" y="335.0" class="label" text-anchor="middle">private zones</text>
  <rect x="40" y="430" width="240" height="74" rx="7" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="160.0" y="461.0" class="label" text-anchor="middle">Applications</text>
  <text x="160.0" y="485.0" class="label" text-anchor="middle">in a VPC</text>
  <rect x="510" y="280" width="170" height="74" rx="7" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="595.0" y="323.0" class="label" text-anchor="middle">Private DNS</text>
  <rect x="770" y="280" width="150" height="74" rx="7" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="845.0" y="323.0" class="label" text-anchor="middle">Public DNS</text>
  <path d="M 280 167 H 480 V 292 H 510" class="edge"/>
  <text x="380" y="134" class="message" text-anchor="middle">Publish names</text>
  <text x="380" y="158" class="message" text-anchor="middle">and addresses</text>
  <path d="M 280 317 H 510" class="edge"/>
  <text x="395" y="298" class="message" text-anchor="middle">Associate with VPC</text>
  <path d="M 280 467 H 480 V 342 H 510" class="edge" marker-start="url(#arrow)"/>
  <text x="380" y="428" class="message" text-anchor="middle">Stable resolver:</text>
  <text x="380" y="452" class="message" text-anchor="middle">queries and answers</text>
  <path d="M 680 317 H 770" class="edge"/>
  <text x="725" y="244" class="message" text-anchor="middle">Resolve</text>
  <text x="725" y="268" class="message" text-anchor="middle">public names</text>
</svg>
