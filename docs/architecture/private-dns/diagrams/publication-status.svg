<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">3. Record observations and report status</title>
  <desc id="description">Regional NATS delivers the acknowledgment to the status handler. The handler records the publication observation in the store and reports serving status to the consumer project API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="540" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">3. Record observations and report status</text>
  <rect x="20" y="120" width="200" height="66" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="120.0" y="147.0" class="heading" text-anchor="middle">Regional</text>
  <text x="120.0" y="171.0" class="heading" text-anchor="middle">NATS</text>
  <path d="M 120 186 V 505" class="lifeline"/>
  <rect x="260" y="120" width="200" height="66" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="360.0" y="147.0" class="heading" text-anchor="middle">Status</text>
  <text x="360.0" y="171.0" class="heading" text-anchor="middle">handler</text>
  <path d="M 360 186 V 505" class="lifeline"/>
  <rect x="500" y="120" width="200" height="66" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="600.0" y="147.0" class="heading" text-anchor="middle">Publication</text>
  <text x="600.0" y="171.0" class="heading" text-anchor="middle">store</text>
  <path d="M 600 186 V 505" class="lifeline"/>
  <rect x="740" y="120" width="200" height="66" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="840.0" y="147.0" class="heading" text-anchor="middle">Consumer</text>
  <text x="840.0" y="171.0" class="heading" text-anchor="middle">project API</text>
  <path d="M 840 186 V 505" class="lifeline"/>
  <text x="240.0" y="255" class="message" text-anchor="middle">Deliver acknowledgment</text>
  <path d="M 120 270 H 360" class="edge return"/>
  <text x="480.0" y="336" class="message" text-anchor="middle">Record publication</text>
  <text x="480.0" y="360" class="message" text-anchor="middle">observation</text>
  <path d="M 360 375 H 600" class="edge"/>
  <text x="600.0" y="465" class="message" text-anchor="middle">Report serving status</text>
  <path d="M 360 480 H 840" class="edge"/>
</svg>
