<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="title description">
  <title id="title">Proposed qualification: control planes</title>
  <desc id="description">Two project control planes each contain a Compute publisher and project DNS APIs. Trusted VPC integration writes access intent to both and private service authorization to Karmada. The management cluster hosts Milo project discovery, two DNS control-plane replicas, the DNS service managed project API, three-node TLS JetStream with persistent volumes, and Karmada. Controllers read project APIs and Milo discovery, read and write the DNS service API, and publish to JetStream. Karmada distributes to both edge clusters. JetStream carries serving updates to both node tiers and the regional tier.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="1040" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">Proposed qualification: control planes</text>
  <rect x="32" y="115" width="416" height="230" rx="10" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="50" y="144" class="heading" text-anchor="start">Project A control plane</text>
  <rect x="57" y="165" width="366" height="60" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="240.0" y="201.0" class="heading" text-anchor="middle">Compute publisher A</text>
  <rect x="57" y="270" width="366" height="55" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="240.0" y="303.5" class="heading" text-anchor="middle">Project DNS APIs</text>
  <path d="M 240 225 V 270" class="edge"/>
  <rect x="512" y="115" width="416" height="230" rx="10" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="530" y="144" class="heading" text-anchor="start">Project B control plane</text>
  <rect x="537" y="165" width="366" height="60" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="720.0" y="201.0" class="heading" text-anchor="middle">Compute publisher B</text>
  <rect x="537" y="270" width="366" height="55" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="720.0" y="303.5" class="heading" text-anchor="middle">Project DNS APIs</text>
  <path d="M 720 225 V 270" class="edge"/>
  <rect x="32" y="400" width="896" height="540" rx="10" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="480.0" y="429" class="heading" text-anchor="middle">Management cluster</text>
  <rect x="60" y="460" width="310" height="80" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="215.0" y="494.0" class="heading" text-anchor="middle">Trusted VPC / DNS</text>
  <text x="215.0" y="518.0" class="heading" text-anchor="middle">integration</text>
  <path d="M 215 460 V 375 H 480 V 297 H 423" class="edge"/>
  <path d="M 480 297 H 537" class="edge"/>
  <text x="470" y="367" class="message" text-anchor="middle">Access intent</text>
  <rect x="590" y="460" width="310" height="80" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="745.0" y="494.0" class="heading" text-anchor="middle">Milo core API</text>
  <text x="745.0" y="518.0" class="heading" text-anchor="middle">Project discovery</text>
  <rect x="320" y="620" width="320" height="80" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="480.0" y="654.0" class="heading" text-anchor="middle">Two DNS control-plane</text>
  <text x="480.0" y="678.0" class="heading" text-anchor="middle">replicas</text>
  <path d="M 57 297 H 16 V 660 H 320" class="edge"/>
  <path d="M 903 297 H 944 V 600 H 680 V 660 H 640" class="edge"/>
  <path d="M 745 540 V 575 H 480 V 620" class="edge"/>
  <rect x="60" y="790" width="250" height="110" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="185.0" y="839.0" class="heading" text-anchor="middle">Karmada</text>
  <text x="185.0" y="863.0" class="heading" text-anchor="middle">federation API</text>
  <rect x="350" y="790" width="270" height="110" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="485.0" y="839.0" class="heading" text-anchor="middle">DNS service managed</text>
  <text x="485.0" y="863.0" class="heading" text-anchor="middle">project API</text>
  <rect x="660" y="790" width="240" height="110" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="780.0" y="827.0" class="heading" text-anchor="middle">TLS JetStream</text>
  <text x="780.0" y="851.0" class="detail" text-anchor="middle">Three nodes</text>
  <text x="780.0" y="875.0" class="detail" text-anchor="middle">Persistent volumes</text>
  <path d="M 215 540 V 575 H 185 V 650 Q 205 660 185 670 V 790" class="edge"/>
  <text x="175" y="735" class="message" text-anchor="end">Private service</text>
  <text x="175" y="759" class="message" text-anchor="end">authorization</text>
  <path d="M 480 700 V 790" class="edge" marker-start="url(#arrow)"/>
  <path d="M 600 700 V 745 H 780 V 790" class="edge"/>
  <path d="M 185 900 V 980" class="edge"/>
  <text x="185" y="1010" class="message" text-anchor="middle">To Edge A and Edge B</text>
  <path d="M 780 900 V 980" class="edge return"/>
  <text x="780" y="1010" class="message" text-anchor="middle">To node and regional tiers</text>
</svg>
