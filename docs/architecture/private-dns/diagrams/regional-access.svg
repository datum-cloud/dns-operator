<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">One context, two regional access bindings</title>
  <desc id="description">A consumer project contains one DNSResolverContext and two access bindings. The central binding selects the central shared fleet; the east binding selects the east shared fleet. Regional serving fleets do not imply independent publication or automatic cross-region failover.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0C1D31"/></marker>
  </defs>
  <style>
    text { font-family: "Alliance No.1", "Alliance No 1", Arial, Helvetica, sans-serif; fill: #0C1D31; }
    .title { font-size: 25px; font-weight: 700; }
    .heading { font-size: 20px; font-weight: 700; }
    .label { font-size: 18px; }
    .detail { font-size: 17px; fill: #384555; }
    .message { font-size: 17px; fill: #384555; paint-order: stroke; stroke: #F9F9F8; stroke-width: 5px; stroke-linejoin: round; }
    .eyebrow { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; letter-spacing: 1px; fill: #384555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
    .edge { fill: none; stroke: #0C1D31; stroke-width: 1.8; stroke-linejoin: round; marker-end: url(#arrow); }
    .return { stroke-dasharray: 6 5; }
    .lifeline { stroke: #90969C; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <rect width="960" height="480" fill="#F9F9F8"/>
  <rect x="32" y="28" width="8" height="8" fill="#0C1D31"/>
  <text x="50" y="36" class="eyebrow" text-anchor="start">PRIVATE DNS</text>
  <text x="32" y="75" class="title" text-anchor="start">One context, two regional access bindings</text>
  <rect x="32" y="115" width="570" height="260" rx="10" fill="none" stroke="#90969C" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="50" y="144" class="heading" text-anchor="start">Consumer project API</text>
  <rect x="55" y="210" width="240" height="75" rx="8" fill="#F3F8DD" stroke="#90969C" stroke-width="1.2"/>
  <text x="175.0" y="253.5" class="heading" text-anchor="middle">DNSResolverContext</text>
  <rect x="345" y="165" width="235" height="65" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="462.5" y="203.5" class="heading" text-anchor="middle">Central access binding</text>
  <rect x="670" y="165" width="258" height="65" rx="8" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="799.0" y="203.5" class="heading" text-anchor="middle">Central shared fleet</text>
  <path d="M 295 247 H 320 V 197 H 345" class="edge"/>
  <path d="M 580 197 H 670" class="edge"/>
  <rect x="345" y="285" width="235" height="65" rx="8" fill="white" stroke="#90969C" stroke-width="1.2"/>
  <text x="462.5" y="323.5" class="heading" text-anchor="middle">East access binding</text>
  <rect x="670" y="285" width="258" height="65" rx="8" fill="#DDE8F2" stroke="#90969C" stroke-width="1.2"/>
  <text x="799.0" y="323.5" class="heading" text-anchor="middle">East shared fleet</text>
  <path d="M 295 247 H 320 V 317 H 345" class="edge"/>
  <path d="M 580 317 H 670" class="edge"/>
  <rect x="32" y="402" width="896" height="50" rx="6" fill="#F3F8DD" stroke="none" stroke-width="1.2"/>
  <text x="48" y="428" class="detail" text-anchor="start">Each binding owns its access mapping and readiness. Publication still uses a shared store.</text>
</svg>
