apiVersion: v1
kind: Namespace
metadata:
  name: project-e2e
---
apiVersion: v1
kind: Namespace
metadata:
  name: compute-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: internal-dns-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dns-publisher
  namespace: compute-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: compute-dns-publisher
  namespace: project-e2e
rules:
  - apiGroups: [dns.networking.miloapis.com]
    resources: [dnsmanagednamespaces, dnsresolvercontexts]
    verbs: [get, list, watch]
  - apiGroups: [dns.networking.miloapis.com]
    resources: [dnsregistrations, dnscontributiongrants, dnsrecordcontributions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [dns.networking.miloapis.com]
    resources: [dnsrecordcontributions/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: compute-dns-publisher
  namespace: project-e2e
subjects:
  - kind: ServiceAccount
    name: dns-publisher
    namespace: compute-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: compute-dns-publisher
