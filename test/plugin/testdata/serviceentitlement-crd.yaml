# A minimal stand-in for service-catalog's ServiceEntitlement CRD.
#
# go.miloapis.com/service-catalog is deliberately not a dependency of this
# module (see internal/cmd/dns/util/entitlement.go), so the real CRD is not
# available to apply. This reproduces the parts the pre-flight actually reads —
# scope, group/version/kind, spec.serviceRef.name, and status.phase — matching
# the upstream type, which is cluster-scoped.
#
# The status subresource is intentionally NOT declared, so a test can create an
# entitlement in a given phase with a single Create call. The real CRD does
# declare it; nothing in the pre-flight writes status, so the difference is not
# observable from the code under test.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceentitlements.services.miloapis.com
spec:
  group: services.miloapis.com
  scope: Cluster
  names:
    kind: ServiceEntitlement
    listKind: ServiceEntitlementList
    plural: serviceentitlements
    singular: serviceentitlement
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                serviceRef:
                  type: object
                  properties:
                    name:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
